# Environment variables that may be set from a Docker secret file, and the
# processes that receive each one.
#
# This is the only list. env_secrets.py loads it once and checks it with a
# Pydantic model; nothing else parses it. The supervisor
# (docker/launch_headless.py, docker/run_bundle.py) builds every process's
# environment with env_secrets.environment_for, which removes each listed
# variable, and its NAME_FILE companion, from every process not named in its
# receivers. Variables that are not listed reach every process.
# tests/test_env_secret_names.py fails when code reads a secret-looking
# variable that is neither here nor in that test's commented allowlist of
# non-secret names. The tables in user_docs_source/docker.md are generated
# from this file by scripts/export_secret_env_docs.py; run it after a change
# (its --check mode, and the fast test profile, fail when the docs are stale).
#
# Format:
#
#   processes:        every valid process name, with a one-line description.
#                     It must match the process names in env_secrets.py.
#   groups:           a list of groups, each with a name and its variables:
#     - name: Group heading used in the docs
#       variables:
#         NAME:
#           receivers: [process, ...]   the processes that receive NAME
#           file: value                 value | none (default: value)
#           about: What it is and who needs it, in plain words.
#
# file says how NAME_FILE works:
#   value   NAME_FILE names a file holding the value.
#   none    No NAME_FILE form; the entry only limits who receives NAME. Used
#           for broker settings that are not secrets, and for secrets a tool
#           reads from its own file. A NAME ending in "*" covers every
#           variable starting with the text before it, and must use none.
#
# Unknown keys, unknown process names, other file values, malformed or
# duplicate names, and an entry without receivers or about are refused, and
# the error names the entry.
#
# Precedence: a NAME_FILE value beats a NAME value from team.env or anywhere
# else. The container entrypoint (docker/entrypoint.sh) runs
# "env_secrets.py check-container-env" before it starts anything, which
# refuses a container environment that sets both NAME and NAME_FILE, or a
# NAME_FILE that points to a missing file. Each Python program then reads the
# files itself when it starts (env_secrets.materialize_secret_file_envs).
#
# A variable name chosen in configuration (for example a custom
# web_chat_token_env_var) is routed like the listed name it replaces.

processes:
  gateway: The gateway (Web Chat, chat channels, access Inbox).
  manager: The team lead; agents it starts at run time are threads inside this process.
  agent: Every other agent process started from the roster.
  secure_broker: The secure tool broker, which runs credentialed tools and MCP connections.
  activity_collector: The activity collector, which records and shows agent activity.
  execution_controller: The execution controller for managed jobs.
  adapter_host: The external adapter host for chat channels.
  consumer_check: The NATS consumer check run before agents start.
  openshell_gateway: The managed openshell-gateway for sandboxes.
  nats: The local nats-server; it receives no listed variable.
  openshell_cli: The openshell command the supervisor runs; it receives no listed variable.
  sealbox: The managed sealbox-server; it receives no listed variable.
  postgres: The bundled Postgres server and its tools; they receive no listed variable.

groups:
  - name: Message broker and storage
    variables:
      NATS_USER:
        receivers: [gateway, manager, agent, secure_broker, activity_collector, execution_controller, adapter_host, consumer_check]
        about: User name for the NATS message broker; every process that sends or receives team messages.
      NATS_PASSWORD:
        receivers: [gateway, manager, agent, secure_broker, activity_collector, execution_controller, adapter_host, consumer_check]
        about: Password for the NATS message broker; every process that sends or receives team messages.
      POSTGRES_DSN:
        receivers: [gateway, manager, agent, secure_broker, activity_collector, execution_controller, adapter_host, consumer_check]
        about: PostgreSQL connection string, including its password; every process that stores team records.

  # The gateway and the adapter host use XAI_API_KEY for voice messages.
  - name: Model providers and embeddings
    variables:
      OPENAI_API_KEY:
        receivers: [manager, agent]
        about: Overrides the key saved with /auth model for OpenAI (api.openai.com); the team lead and agents.
      OPENAI_CODEX_ACCESS_TOKEN:
        receivers: [manager, agent]
        about: Short-lived ChatGPT sign-in token for the openai-codex model provider; the team lead and agents.
      CODEX_ACCESS_TOKEN:
        receivers: [manager, agent]
        about: The same ChatGPT sign-in token under the Codex CLI's name; the team lead and agents.
      XAI_API_KEY:
        receivers: [manager, agent, gateway, adapter_host]
        about: Overrides the key saved with /auth model for xAI (api.x.ai), for Grok models (provider xai) and voice messages; the team lead and agents, the gateway and adapter host.
      XAI_OAUTH_ACCESS_TOKEN:
        receivers: [manager, agent]
        about: Short-lived xAI sign-in token for the xai-oauth model provider; the team lead and agents.
      GEMINI_API_KEY:
        receivers: [manager, agent]
        about: Overrides the key saved with /auth model for Google Gemini; the team lead and agents.
      ANTHROPIC_API_KEY:
        receivers: [manager, agent]
        about: Overrides the key saved with /auth model for Anthropic (api.anthropic.com); the team lead and agents.
      LITELLM_API_KEY:
        receivers: [manager, agent]
        about: Overrides the key saved with /auth model for the OpenAI-compatible model endpoint; the team lead and agents.
      EMBEDDING_API_KEY:
        receivers: [manager, agent]
        about: Overrides the key saved with /auth model for the embedding service used by memory search; the team lead and agents.

  # Exa, Brave Search and Crawl4AI keys are not environment variables: they are
  # linked accounts in the credential store (/link http:exa team, and so on),
  # and startup refuses EXA_API_KEY, BRAVE_SEARCH_API_KEY and CRAWL4AI_API_TOKEN
  # (runtime_settings.services.REMOVED_LINKED_KEY_ENV_VARS).

  # Account ids that are only useful together with their secret
  # (TWILIO_ACCOUNT_SID, PHOTON_PROJECT_ID) are listed so both halves can come
  # from secret files. The Photon sidecar that the gateway or adapter host
  # starts receives only its own Photon values
  # (assistant_gateway/interactive_apps/photon.py).
  - name: Web Chat and chat channels
    variables:
      WEB_CHAT_AUTH_TOKEN:
        receivers: [gateway]
        about: Token that protects Web Chat sign-in; only the gateway checks it.
      ADAPTER_HOST_AUTH_TOKEN:
        receivers: [gateway, adapter_host]
        about: Token the gateway and the external adapter host use to trust each other.
      TELEGRAM_BOT_TOKEN:
        receivers: [gateway, adapter_host]
        about: Telegram bot token for the Telegram channel; whichever of the gateway or adapter host runs it.
      DISCORD_BOT_TOKEN:
        receivers: [gateway, adapter_host]
        about: Discord bot token for the Discord channel; whichever of the gateway or adapter host runs it.
      TWILIO_ACCOUNT_SID:
        receivers: [gateway, adapter_host]
        about: Twilio account id for the WhatsApp channel, used together with TWILIO_AUTH_TOKEN.
      TWILIO_AUTH_TOKEN:
        receivers: [gateway, adapter_host]
        about: Twilio auth token for the WhatsApp channel.
      PHOTON_PROJECT_ID:
        receivers: [gateway, adapter_host]
        about: Photon project id for the Photon channel, used together with PHOTON_PROJECT_SECRET.
      PHOTON_PROJECT_SECRET:
        receivers: [gateway, adapter_host]
        about: Photon project secret for the Photon channel.
      PHOTON_SIDECAR_TOKEN:
        receivers: [gateway, adapter_host]
        about: Token between the gateway or adapter host and the Photon sidecar program it starts.

  # Agents send events with the ingest token; the gateway reads the activity
  # pages with the user and admin tokens.
  - name: Activity collector
    variables:
      ACTIVITY_COLLECTOR_USER_TOKEN:
        receivers: [gateway, activity_collector]
        about: Token the gateway uses to show people their activity pages.
      ACTIVITY_COLLECTOR_ADMIN_TOKEN:
        receivers: [gateway, activity_collector]
        about: Token the gateway uses to show administrators every activity page.
      ACTIVITY_COLLECTOR_INGEST_TOKEN:
        receivers: [manager, agent, activity_collector]
        about: Token the team lead and agents use to send activity events to the collector.

  # Only the broker holds its root token; the supervisor gives every other
  # process that calls the broker a token derived for it
  # (access_control.caller_tokens). The gateway signs people's task contexts
  # and the manager's scheduler signs scheduled runs, including runs that a
  # separately started agent claimed (it asks the manager with its claim,
  # custom_agents.scheduled_run_contexts); every runtime process gets the
  # public verification keys.
  - name: Internal credentials
    variables:
      SECURE_TOOL_BROKER_TOKEN:
        receivers: [secure_broker]
        about: The broker's root token; every other process that calls the broker gets its own token derived from it.
      ACCESS_GATEWAY_SIGNING_KEY:
        receivers: [gateway]
        about: Private key the gateway uses to sign the task context of each person's request.
      ACCESS_SCHEDULER_SIGNING_KEY:
        receivers: [manager]
        about: Private key the team lead's scheduler uses to sign scheduled runs.
      ACCESS_CONTEXT_VERIFY_KEYS:
        receivers: [gateway, manager, agent, secure_broker, activity_collector, execution_controller, adapter_host]
        about: Public keys every Universal Agents process uses to check signed task contexts.
      OPENSHELL_SSH_HANDSHAKE_SECRET:
        receivers: [openshell_gateway]
        about: Secret the managed openshell-gateway uses for its SSH connections to sandboxes.

  # GitHub and Google use each person's own sign-in and Hugging Face and X
  # use account links, all in the credential store; their old token
  # variables are refused at startup (runtime_settings.security).
  - name: Credentials of the tools the secure tool broker runs
    variables:
      BW_SESSION:
        receivers: [secure_broker]
        about: Unlocked session key for the Bitwarden CLI (bw) the broker runs.
      BW_CLIENTID:
        receivers: [secure_broker]
        about: Bitwarden API key id the broker uses to sign in the Bitwarden CLI.
      BW_CLIENTSECRET:
        receivers: [secure_broker]
        about: Bitwarden API key secret the broker uses to sign in the Bitwarden CLI.
      BW_PASSWORD:
        receivers: [secure_broker]
        about: Bitwarden master password the broker uses to unlock the vault.
      GOG_KEYRING_PASSWORD:
        receivers: [secure_broker]
        about: Password for the file keyring of the Google Workspace CLI (gog) the broker runs.
      OP_SERVICE_ACCOUNT_TOKEN:
        receivers: [secure_broker]
        about: 1Password service account token for the 1Password CLI (op) the broker runs.
      OP_CONNECT_TOKEN:
        receivers: [secure_broker]
        about: 1Password Connect server token for the 1Password CLI (op) the broker runs.
      KEEPASSXC_PASSWORD:
        receivers: [secure_broker]
        about: Password of the KeePass database the broker opens with keepassxc-cli.
      KEEPASS_PASSWORD:
        receivers: [secure_broker]
        about: Password of the KeePass database under its shorter name, for the broker's KeePass tool.
      VAULT_TOKEN:
        receivers: [secure_broker]
        about: HashiCorp Vault token for the Vault CLI the broker runs.

  - name: Cloud provider credentials
    variables:
      AWS_ACCESS_KEY_ID:
        receivers: [manager, agent]
        about: AWS access key id for Amazon Bedrock models; the team lead and agents.
      AWS_SECRET_ACCESS_KEY:
        receivers: [manager, agent]
        about: AWS secret access key for Amazon Bedrock models; the team lead and agents.
      AWS_SESSION_TOKEN:
        receivers: [manager, agent]
        about: Temporary AWS session token for Amazon Bedrock models; the team lead and agents.

  # They are not secrets, or are secrets the broker's tools read from their
  # own files, so they have no NAME_FILE form; only the broker receives them.
  - name: Broker tool settings and sign-in state
    variables:
      OP_SESSION_*:
        receivers: [secure_broker]
        file: none
        about: 1Password CLI sign-in sessions, one variable per account.
      BITWARDENCLI_APPDATA_DIR:
        receivers: [secure_broker]
        file: none
        about: Folder where the Bitwarden CLI keeps its data.
      BITWARDEN_SERVER_URL:
        receivers: [secure_broker]
        file: none
        about: Address of a self-hosted Bitwarden server.
      BW_SERVER_URL:
        receivers: [secure_broker]
        file: none
        about: Address of a self-hosted Bitwarden server, under its shorter name.
      GH_CONFIG_DIR:
        receivers: [secure_broker]
        file: none
        about: Folder for the GitHub CLI's settings and sign-in.
      GH_HOST:
        receivers: [secure_broker]
        file: none
        about: GitHub Enterprise Server host name for the GitHub CLI.
      GITHUB_CONFIG_DIR:
        receivers: [secure_broker]
        file: none
        about: Folder for the GitHub CLI's settings and sign-in, under its other name.
      OP_CONNECT_HOST:
        receivers: [secure_broker]
        file: none
        about: Address of the 1Password Connect server.
      OP_ACCOUNT:
        receivers: [secure_broker]
        file: none
        about: 1Password account the 1Password CLI uses.
      OP_CONFIG_DIR:
        receivers: [secure_broker]
        file: none
        about: Folder for the 1Password CLI's settings.
      KEEPASSXC_DATABASE:
        receivers: [secure_broker]
        file: none
        about: Path of the KeePass database file.
      KEEPASS_DATABASE:
        receivers: [secure_broker]
        file: none
        about: Path of the KeePass database file, under its shorter name.
      KEEPASSXC_KEY_FILE:
        receivers: [secure_broker]
        file: none
        about: Path of the KeePass key file.
      KEEPASS_KEY_FILE:
        receivers: [secure_broker]
        file: none
        about: Path of the KeePass key file, under its shorter name.
      KEEPASSXC_NO_PASSWORD:
        receivers: [secure_broker]
        file: none
        about: Switch for a KeePass database that has no password.
      KEEPASS_NO_PASSWORD:
        receivers: [secure_broker]
        file: none
        about: Switch for a KeePass database that has no password, under its shorter name.
      VAULT_ADDR:
        receivers: [secure_broker]
        file: none
        about: Address of the HashiCorp Vault server.
      VAULT_KV_MOUNT:
        receivers: [secure_broker]
        file: none
        about: Name of the Vault key-value store the broker reads.
      SEALBOX_URL:
        receivers: [secure_broker]
        file: none
        about: Address of the Sealbox server.
      SEALBOX_TOKEN:
        receivers: [secure_broker]
        file: none
        about: Sealbox access token; the Sealbox CLI reads its own SEALBOX_TOKEN_FILE, which the broker points at each owner's file.
      SEALBOX_PUBLIC_KEY:
        receivers: [secure_broker]
        file: none
        about: Sealbox public key; the Sealbox CLI reads its own SEALBOX_PUBLIC_KEY_FILE.
      SEALBOX_PRIVATE_KEY:
        receivers: [secure_broker]
        file: none
        about: Sealbox private key; the Sealbox CLI reads its own SEALBOX_PRIVATE_KEY_FILE.
      SEALBOX_OUTPUT_FORMAT:
        receivers: [secure_broker]
        file: none
        about: Output format the Sealbox CLI uses.
      SEALBOX_CLI_PATH:
        receivers: [secure_broker]
        file: none
        about: Path of the Sealbox CLI program.
      SEALBOX_SERVER_PATH:
        receivers: [secure_broker]
        file: none
        about: Path of the sealbox-server program.
      SEALBOX_BIND_HOST:
        receivers: [secure_broker]
        file: none
        about: Address the managed sealbox-server listens on.
      SEALBOX_BIND_PORT:
        receivers: [secure_broker]
        file: none
        about: Port the managed sealbox-server listens on.
      SEALBOX_STORE_PATH:
        receivers: [secure_broker]
        file: none
        about: Folder where the managed sealbox-server keeps its data.
      SEALBOX_ROOT_TOKEN_FILE:
        receivers: [secure_broker]
        file: none
        about: Path of the managed sealbox-server's root token file.
      SEALBOX_API_VERSION:
        receivers: [secure_broker]
        file: none
        about: Sealbox API version the broker uses.
      SEALBOX_READY_TIMEOUT_SECONDS:
        receivers: [secure_broker]
        file: none
        about: How long the broker waits for the managed sealbox-server to start.
      SECURE_TOOL_BROKER_SEALBOX_ENABLED:
        receivers: [secure_broker]
        file: none
        about: Switch that turns on Sealbox as the broker's credential store.
      SECURE_TOOL_BROKER_SEALBOX_MANAGE_SERVICE:
        receivers: [secure_broker]
        file: none
        about: Switch that lets the broker start and stop its own sealbox-server.
      SECURE_TOOL_BROKER_SEALBOX_AUTO_INITIALIZE:
        receivers: [secure_broker]
        file: none
        about: Switch that lets the broker set up a new Sealbox store on first start.
      SECURE_TOOL_BROKER_SEALBOX_TENANT_MATERIAL_DIR:
        receivers: [secure_broker]
        file: none
        about: Folder for each owner's Sealbox key files.
      SECURE_TOOL_BROKER_CREDENTIALS_DIR:
        receivers: [secure_broker]
        file: none
        about: Folder for the broker's per-owner tool sign-in files.
      SECURE_TOOL_BROKER_CREDENTIAL_STATE_BACKEND_MODE:
        receivers: [secure_broker]
        file: none
        about: Where the broker keeps tool sign-in state.
      SECURE_TOOL_BROKER_CREDENTIAL_STATE_BACKEND_SOURCE:
        receivers: [secure_broker]
        file: none
        about: Credential store the broker uses for tool sign-in state.
      SECURE_TOOL_BROKER_CREDENTIAL_STATE_BACKEND_NAMESPACE:
        receivers: [secure_broker]
        file: none
        about: Name prefix for the broker's tool sign-in state in that store.
      SECURE_TOOL_BROKER_CREDENTIAL_STATE_BACKEND_FALLBACK_TO_FILES:
        receivers: [secure_broker]
        file: none
        about: Switch that lets the broker keep tool sign-in state in files when the store is unavailable.
