# Protocol 1 transport: streams, consumers, buckets and limits.
#
# Work, request and event subjects start with ua.v1.<audience team>.<sender slot>.:
# the sender slot is the issuer's runtime id, or x-<installation> for a frame from
# another installation. Replies use the requester's _INBOX.<runtime>.<token(s)>
# subject, signed in the reply frame. Pull and acknowledgement API permissions name
# exact consumers.
# Edit by hand, then run scripts/export_message_contract.py.

subject_prefix: ua.v1.{team}.{sender}
reply_inbox_prefix: _INBOX.{runtime}
peer_sender_slot: x-{installation}
# Installation-wide traffic (joining, renewing a certificate) names this scope where other
# frames name a team: as the issuer's and the audience's team, and as the subject's team
# token (ua.v1._install.<sender>.svc.<operation>). Team ids cannot start with _.
installation_scope: _install

# Which host roles serve each audience target. A role receives a kind's address, and
# gets its subscription or consumer grants, only when it is one of the kind's receivers
# and serves the target that address delivers to.
audience_targets:
  agent: [lead_host, worker_host]
  pool: [lead_host, worker_host]
  edge: [gateway, edge_adapter]   # an edge is a gateway route or an outside-agent adapter
  team_services: [team_services, scheduler]   # the scheduler answers only run_context.sign, which signs a run's token
  team: [gateway, lead_host, worker_host, team_services, edge_adapter, installation_authority, scheduler]
  installation_service: [installation_authority]

# How far apart two hosts' clocks may be. Receivers apply it at both ends of every
# time window: a frame's issue, not-before and expiry times, and the validity of the
# certificates, sessions and authority tokens it relies on.
clock_skew_seconds: 8

# Every broker that carries protocol 1 runs at least this version, with these
# server-wide JetStream settings (NATS has no per-stream equivalent).
server:
  minimum_version: 2.15.1
  jetstream:
    sync_interval: always       # a confirmed write must survive power loss

limits:
  max_frame_bytes: 262144      # larger content goes to the object store by reference
  nats_max_payload_bytes: 1048576

classes:
  durable:
    description: at least once; the sender records before publishing, the receiver admits durably before acknowledging
    between_installations: true   # the only class another installation may send: NATS forgets reply routes between accounts
    stream: UA1_WORK
    addresses:
      - work.agent.{agent}
      - work.pool.{pool}
      - work.edge.{edge}
      - work.team
    max_expiry_seconds: 604800
  request_reply:
    description: answered at once or "no responders"; changes carry an idempotency key, and the receiver stores the final outcome with the change before replying, except outcomes that ask for a retry (README, "Stored outcomes")
    between_installations: false
    addresses:
      - svc.team.{operation}
      - ctl.agent.{agent}.{operation}
    installation_addresses:
      - _install.{sender}.svc.{operation}
    max_expiry_seconds: 30
  event:
    description: at most once; never the only way something important happens
    between_installations: false
    addresses:
      - evt.{event}
    max_expiry_seconds: 300
  dead_letter:
    description: set-aside copies and notices, under the receiving runtime's id
    between_installations: false
    stream: UA1_DLQ
    addresses:
      - dlq.raw.{copy}
      - dlq.notice.{copy}
    max_expiry_seconds: 2592000

streams:
  UA1_WORK:
    subjects: [ua.v1.*.*.work.>]
    retention: workqueue
    storage: file
    max_age_seconds: 604860     # the durable class's longest expiry plus a minute (more than the clock tolerance): no receiver could still accept older work
    duplicate_window_seconds: 120
    max_consumers: 4096         # NATS 2.15 defaults to 1,000 per stream
    max_message_bytes: 262144
  UA1_DLQ:
    subjects: [ua.v1.*.*.dlq.>]
    retention: limits
    storage: file
    max_age_seconds: 2592060    # the dead-letter class's expiry plus a minute

# Consumer names join ids with ~, which ids cannot contain: with _ (allowed in ids),
# team "team_example" with agent "researcher-2" and team "team" with agent
# "example_researcher-2" would share one consumer, and NATS silently updates the
# first consumer's filter when the second is created.
consumers:
  agent_inbox:
    stream: UA1_WORK
    name: agent~{team}~{agent}
    filter: ua.v1.{team}.*.work.agent.{agent}
    mode: pull
    ack: explicit
    ack_wait_seconds: 60
    max_deliveries: 20
  pool:
    stream: UA1_WORK
    name: pool~{team}~{pool}
    filter: ua.v1.{team}.*.work.pool.{pool}
    mode: pull
    ack: explicit
    ack_wait_seconds: 60
    max_deliveries: 20
  team_services:
    stream: UA1_WORK
    name: team~{team}
    filter: ua.v1.{team}.*.work.team
    mode: pull
    ack: explicit
    ack_wait_seconds: 60
    max_deliveries: 20
  edge:
    stream: UA1_WORK
    name: edge~{team}~{edge}
    filter: ua.v1.{team}.*.work.edge.{edge}
    mode: pull
    ack: explicit
    ack_wait_seconds: 60
    max_deliveries: 20

key_value:
  UA1_CERTS:
    description: host certificates, revocations, agent sessions and agreements (registry state_records); each record is signed, so readers trust the signature, not the bucket
    per_key_ttl_seconds: 0
  UA1_HOSTS:
    description: one record per runtime host; written every 20 s, expires after 60 s (each record also states its expiry)
    per_key_ttl_seconds: 60
  UA1_AGENTS:
    description: one record per agent (availability, busy, idle, paused, exiting), written only on change
    per_key_ttl_seconds: 0
  UA1_PLACEMENT:
    description: which host runs an agent and that host's epoch; the record's signed sequence is the fencing token
    per_key_ttl_seconds: 0
  UA1_TEAM_VIEW:
    description: the team's shared view of open work
    per_key_ttl_seconds: 0

object_store:
  UA1_BLOBS:
    description: files and long text, named by SHA-256; the owner deletes them

# How long a receiver keeps replay records: at least the longest expiry of any class plus the clock tolerance.
replay_ledger_retention_seconds: 2592060   # 30 days plus a minute
