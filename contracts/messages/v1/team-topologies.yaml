# Team topologies: who may send which kinds to whom.
#
# An agent role is the agent's place in its team (not a host role). An edge is the
# direction a message travels (edges, below). The registry lists the edges each kind may
# travel; a topology allows or refuses each edge for each agent role.
# Edit by hand, then run scripts/export_message_contract.py.

agent_roles:
  lead: holds conversations with people, splits work and decides for its team
  worker: does the work its lead or a person's own schedule gives it

# Rules that hold in every topology.
# The edge a message travels on, from the receiver's place relative to the sender for the
# task the message is about (the task's thread record, plan 11A.1). A receiver works it out,
# checks it is in the kind's topology_edge list and allowed for the sending agent's role in
# the request's topology, and refuses otherwise with delivery.refused. Messages hosts send
# without an agent (gateway, scheduler, team services) are not topology checks.
edges:
  up: the receiver is the task's requester
  down: the receiver holds the task, or is given it (a delegation)
  sideways: another agent of the same team, with no request between them
  person: a gateway route that reaches the person
  out: an outside agent through an edge adapter, or another team or installation

fixed_rules:
  - access requests and decisions go to the team services, never to a model
  - the output of work a person gave a worker directly (a run of the person's own schedule, or system work with a configured route) goes to the person
  - notifications for delegated work come from the lead
  - a receiver refuses a message whose edge its topology does not allow, and the sender gets delivery.refused
  - a message from an agent that does not hold the task it names is refused
  - only the lead receives work, answers and other messages from outside agents

topologies:
  hub_and_spoke:
    description: Workers talk only to their lead; the lead talks to people and to other teams.
    status: default
    allowed_edges:
      lead: [down, person, out]
      worker: [up]
    contact_text:
      lead: You may give work to your team's workers, answer people, and ask other teams.
      worker: Send everything you need, and every result, to your lead.
  same_type_peers:
    description: As hub_and_spoke, and workers of one type may also ask each other.
    status: later
    allowed_edges:
      lead: [down, person, out]
      worker: [up, sideways]
    contact_text:
      lead: You may give work to your team's workers, answer people, and ask other teams.
      worker: Send results to your lead. You may ask workers of your own type for help.
  all_peers:
    description: Any agent of the team may ask any other; only the lead talks to people and other teams.
    status: later
    allowed_edges:
      lead: [down, person, out, sideways]
      worker: [up, sideways]
    contact_text:
      lead: You may give work to anyone in your team, answer people, and ask other teams.
      worker: Send results to your lead. You may ask anyone in your team for help.
  nested:
    description: A worker may lead a sub-team of its own, which follows hub_and_spoke inside.
    status: later
    allowed_edges:
      lead: [down, person, out]
      worker: [up, down]
    contact_text:
      lead: You may give work to your team's workers, answer people, and ask other teams.
      worker: Send results to your lead. You may give work to your own sub-team.
