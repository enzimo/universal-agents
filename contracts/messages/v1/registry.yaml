    routing: named
    topology_edge: none
    ledger: access_wait_closed
    wakes_model:
      by: status.state
      values:
        handed_down: always
        waiting: never
        granted: always
        denied: always
        withdrawn: always
        already_held: always
        refused: always
    rendering: none

