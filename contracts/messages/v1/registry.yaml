# Protocol 1 registry: one entry per message kind and operation.
#
# Each entry states, for one kind:
#   class          durable | request_reply | event   (transport.yaml describes each class)
#   address        the subject after ua.v1.<audience team>.<sender slot>. , or a list of them, each
#                  delivering to a different audience target; {agent}, {pool} and {edge} are the
#                  audience id, {copy} is the body's copy_id, and the address decides the audience
#                  target: agent, pool, edge, team_services (work.team, svc.team.*, dlq.*) or team
#                  (evt.*). An installation operation's address, _install.{sender}.svc.<operation>,
#                  follows ua.v1. directly: its frames name transport.yaml's installation_scope as
#                  the issuer's and the audience's team, and {sender} is the issuer's runtime
#   copy_to        durable only: addresses that also get a copy of each frame (README, "Durable
#                  copies"); the roles serving the copy's target receive it
#   body           the body schema, under schemas/
#   body_rules     optional: what a schema cannot say, checked after it (README, "What bodies carry"):
#                  unique values in a list, a field required when others have given values,
#                  or at least one of several fields
#   reply          request/reply only: the reply body schema and its error codes, which are exactly
#                  the reply's outcomes other than ok
#   senders        host roles that may publish it; receivers check them against the issuer's certificate
#   senders_by_address  optional: fewer senders for some of its own addresses (the edge adapter
#                  reaches agents, not worker pools)
#   receivers      host roles that may receive it at its own addresses (and so send its reply)
#   expiry_seconds how long after issue a receiver still accepts it (at most its class's max_expiry_seconds)
#   authority      none | optional | required: whether the frame carries an authority token
#   authority_binding  the token types it takes: one binding {type, at, senders}, or a list of them,
#                  one per type; a token of another type is refused. `type` is what the token is
#                  bound to (root_task, command or access_request). With `at`, the body field
#                  naming that record, the receiver compares the two ids; a command binding always
#                  has it. Without `at`, the handler checks the token against the task it holds.
#                  `senders` are the host roles that may present that type (default: every sender
#                  of the frame's address). (README, "On behalf of a person")
#   idempotency    JSON pointers into the frame whose values make the idempotency key:
#                  <kind>:<unpadded base64url SHA-256 of the RFC 8785 array of the values>
#                  (README, "Idempotency keys")
#   admission      execution_slot (needs a free slot), accepted_while_paused, priority
#   routing        requester | holder | team | person | named | broadcast | sender (README, "Replies")
#   topology_edge  the edges an agent may send it on: up | down | person | sideways | out, or none
#                  when it is not a topology check: sent to the team services, only by hosts, or
#                  back to a refused frame's sender; a kind that agent hosts send to an agent,
#                  pool or edge address names its edges (team-topologies.yaml)
#   ledger         the entry the receiver's work ledger records, or none
#   wakes_model    never | always | next_turn, or {by: <body oneOf constant>, values: {<alternative>: ...}}
#                  giving every alternative its own value
#   rendering      how a model sees it: none | sender_line | summary | full
#   covered_change request/reply only: {record_kind, seen_version}, the store record it changes
#                  (one of covered_record_kinds) and whether the writer sends the version it
#                  read: required | required_for_request_writers | optional | none
#                  (README, "Covered changes")
#   verification   standard (the issuer's certificate), or proof_of_possession (a join, signed by the
#                  key its body presents)
#
# Edit by hand, then run scripts/export_message_contract.py.

protocol: 1.0-pre
signing_domain: universal-agents/message-frame/v1
renew_key_proof_domain: universal-agents/host-renew-key-proof/v1
state_signing_domain: universal-agents/state-record/v1
authority_token_domain: universal-agents/authority-token/v1
decision_token_domain: universal-agents/decision-token/v1
frame_schema: frame.schema.json
state_schema: state.schema.json
max_frame_bytes: 262144
max_nesting_depth: 64
authority_token_max_seconds: 604800   # today's signed person context lasts at most 7 days
command_token_max_seconds: 300        # a token bound to one command lasts minutes (plan, section 8)
certificate_overlap_seconds: 300      # a replaced certificate still signs new frames this long after its replacement is issued (authorization plan 12.5)

# Refusals a receiver gives before any handler runs, in the order it checks them.
# "The issuer's certificate" is the host certificate the receiver's trust store holds
# for the issuer's installation, runtime and membership epoch (README, "Who sent it").
verification_refusals:
  - code: too_large
    meaning: the serialized frame is larger than max_frame_bytes
  - code: malformed
    meaning: the frame is not one JSON object, repeats a key, holds a number with a fraction or exponent part, or breaks the frame schema
  - code: unknown_key
    meaning: the trust store holds no certificate for the issuer's installation, runtime and membership epoch that names the issuer's key id and was valid when the frame was issued (a certificate another one replaces is valid only until certificate_overlap_seconds after its replacement was issued), or the installation is neither the receiver's nor one it has an agreement with; a join (verification proof_of_possession) must instead come from the receiver's own installation and name the key it presents in its body, which is not an authority key, and a key id the trust store already knows must keep its public key
  - code: bad_signature
    meaning: the signature is not the one unpadded base64url spelling of a signature that verifies over the canonical frame with the certificate's key
  - code: bad_digest
    meaning: the body digest does not match the body
  - code: revoked
    meaning: the issuer's certificate, or the certificate that signed the issuer's agent session, is listed in its installation's revocations, whenever it was revoked and whenever the frame says it was issued
  - code: epoch_too_old
    meaning: the issuer's certificate has a membership or revocation epoch below the receiver's minimum for that runtime or installation (request/reply and events only; queued work is judged by the certificate valid when it was issued, and a join by the key it presents)
  - code: wrong_issuer
    meaning: the issuer's revocation epoch or team disagrees with its certificate (installation operations and their replies name the installation scope as their team and no agent, and other kinds a team of the certificate); or it names an agent without a session, or a session that does not place that agent, of a type the certificate allows, on the signing runtime when the frame was issued; or a reply does not come from the agent and team the request was for; or a join names an epoch other than zero, a reserved runtime id (x- or _), an agent, or a body runtime or installation other than its issuer's; or a renewal's body names another certificate or membership epoch than the certificate that signs it
  - code: wrong_sender
    meaning: none of the certificate's roles may send the kind to its audience's address (for a reply, receive its request), or a join asks for a role that is not among the kind's senders; or a frame from the receiver's own installation is addressed to another team than its issuer's; or the frame comes from another installation with a kind, class or destination team its agreement does not allow; or it crosses the outside boundary other than through the lead (an outside agent's adapter reaches only the lead's inbox, and only a lead agent or the team services reach an outside agent)
  - code: wrong_team
    meaning: the frame is for another installation or team
  - code: wrong_audience
    meaning: the frame names another receiver
  - code: subject_mismatch
    meaning: the subject is not ua.v1.<audience team>.<sender slot>.<address> for the kind and audience target, the frame arrived on another subject, or a NATS header copy disagrees with the frame; replies use the audience runtime's inbox and name their request
  - code: expired
    meaning: the receiver's clock, less the clock tolerance, is at or after the frame's expiry or its kind's lifetime
  - code: not_yet_valid
    meaning: the frame's issue or not-before time is more than the clock tolerance ahead of the receiver's clock
  - code: replayed
    meaning: a frame with the same issuer installation, runtime, membership epoch and message id was admitted with other content
  - code: unknown_kind
    meaning: the kind is not in this registry
  - code: invalid_body
    meaning: the body breaks the kind's schema or body rules, or the idempotency key is not the one the kind's key parts give; or a renewal's key rotation names a key id the installation already uses or a proof that does not verify; or the certificate in a join or renewal reply does not verify against the receiver's authority keys or does not certify the host that asked (README, "Installation traffic")
  - code: bad_authority
    meaning: the frame carries an authority token its kind does not take or lacks one it requires; or the token is not signed by a gateway or scheduler certificate of its own installation, names a schedule without a scheduler's signature, names another team than the issuer's, was not valid when the frame was issued, names neither a person nor a schedule (system work), lasts longer than authority_token_max_seconds (command_token_max_seconds when bound to a command), is bound to a type of record its kind does not take, is of a type the sender's roles may not present on that address, or is bound to another record than the body field its kind's binding names (at) or, for a binding without one, than the task the handler holds; or a change-conflict decision token in the body is not signed by a team-services certificate of the frame's installation and team, or was not valid when the frame was issued
  - code: access_denied
    meaning: the receiver's access decision refused the sender
# Refusals of a change to a covered store record. Each covered operation offers those that
# can happen to it (README, "Covered changes").
change_refusals:
  - code: changed_since_read
    meaning: the record changed after the writer read it; carries the current version
  - code: change_conflict
    meaning: another request changed the record; carries the case id and the brief reference
  - code: request_closed
    meaning: the request was stopped or ended
  - code: needs_person_decision
    meaning: the person must decide before the change is saved
  - code: record_busy
    meaning: another request is writing the file or sign-in; carries when to try again
# The store records whose changes are covered changes: the store-safety code's
# ChangeRecordKind (a test pins them). No operation changes a file yet; files stay with
# the host that has the folder, and record_busy covers a file another request writes.
covered_record_kinds: [memory_fact, knowledge_page, schedule, objective, heartbeat_item, file, staged_change]
# Outcomes that ask the sender to try again. The receiver of a change operation stores
# every other final outcome under the operation's key, but not these, so a retry with the
# same key is decided again (README, "Stored outcomes"): not_started, steering while its
# request still waits to start; record_busy, a file or sign-in another request is writing;
# runtime_error, a failure that changed nothing; waiting, a staged change the person has
# not decided yet.
retry_outcomes: [not_started, record_busy, runtime_error, waiting]
# Roles that hold NATS permissions. Agent roles for topology are in team-topologies.yaml.
host_roles:
  gateway: talks to people through channels and the web
  lead_host: runs a team's lead agent
  worker_host: runs worker agents
  team_services: the team's operations, steering, access and custody services
  edge_adapter: connects outside agents (A2A)
  installation_authority: issues and revokes certificates and authority keys
  scheduler: fires schedules

# Signed records (state.schema.json). Readers verify each one: authority records with the
# installation's authority keys (their own, or a peer's from an agreement), host records
# with the writer's certificate that was valid when the record was written, unless that
# certificate is revoked. The first four vouch for keys and agents and are kept by the trust
# store; the others report state, are written only by this installation's hosts, and are
# checked again whenever they are read: expiry, issue time, minimum epochs and sequence
# (README, "State records"). Where a record is stored adds no trust. Fields: bucket and key
# form; signer (authority | host); signer_roles, the roles whose certificates may sign it;
# writers, the host roles that may store it (the edge adapter stores unchanged copies of a
# peer's records under the peer's installation id); body; ttl_seconds, the bucket's per-key
# lifetime, within which each record must expire; write_rule.
state_records:
  certificate:
    description: A host's membership certificate.
    bucket: UA1_CERTS
    key: "host.<installation>.<runtime>.<membership_epoch>"
    signer: authority
    writers: [installation_authority, edge_adapter]
    body: state/certificate.schema.json
    write_rule: written once; kept until its expiry plus the longest kind lifetime, so queued frames can still be checked
  revocations:
    description: An installation's revoked certificates.
    bucket: UA1_CERTS
    key: "revocations.<installation>"
    signer: authority
    writers: [installation_authority, edge_adapter]
    body: state/revocations.schema.json
    write_rule: rewritten with a higher sequence on each revocation; the revocation epoch only grows and entries are never removed while a revoked certificate could still be named
  agent_session:
    description: An agent session certificate, issued by the team services that place the agent.
    bucket: UA1_CERTS
    key: "session.<installation>.<team>.<session>"
    signer: host
    signer_roles: [team_services]
    writers: [team_services, edge_adapter]
    body: state/agent_session.schema.json
    write_rule: rewritten with a higher sequence to renew it or to record its actual end; kept until its end plus the longest kind lifetime
  agreement:
    description: A federation agreement with another installation.
    bucket: UA1_CERTS
    key: "agreement.<peer>"
    signer: authority
    writers: [installation_authority]
    body: state/agreement.schema.json
    write_rule: rewritten with a higher sequence to change or end it; only the receiver's own authority signs it
  host:
    description: A runtime host's liveness and capacity, written by the host itself every 20 seconds and naming its certificate.
    bucket: UA1_HOSTS
    key: "<runtime>"
    signer: host
    signer_roles: [gateway, lead_host, worker_host, team_services, edge_adapter, installation_authority, scheduler]
    writers: [gateway, lead_host, worker_host, team_services, edge_adapter, installation_authority, scheduler]
    body: state/host.schema.json
    ttl_seconds: 60
    write_rule: written by the host itself every 20 seconds, expiring within ttl_seconds; a host writes only its own record, names the certificate it signs with and allows at most that certificate's sessions
  agent:
    description: An agent's state, written by the host it is placed on when the state changes.
    bucket: UA1_AGENTS
    key: "<team>.<agent>"
    signer: host
    signer_roles: [lead_host, worker_host]
    writers: [lead_host, worker_host]
    body: state/agent.schema.json
    write_rule: written on change, at most once per 2 seconds; readers accept it only from the placement's host
  placement:
    description: Which host runs an agent; its signed sequence is the fencing token.
    bucket: UA1_PLACEMENT
    key: "<team>.<agent>"
    signer: host
    signer_roles: [team_services]
    writers: [team_services]
    body: state/placement.schema.json
    write_rule: compare-and-set on the last key-value revision, with the next sequence; the signed sequence, not the unsigned revision, is the fencing token, so a stored copy written back is never newer
  team_view:
    description: One entry of a team's shared view of its members, requests, tasks and Objectives.
    bucket: UA1_TEAM_VIEW
    key: "<team>.<entry>.<id>"
    signer: host
    signer_roles: [team_services]
    writers: [team_services]
    body: state/team_view.schema.json
    write_rule: deleted when the item closes or the person it names departs; each entry at most 4 KiB

kinds:
  task.stop:
    description: Stop one task. Sent only to the task's current holder.
    class: durable
    address: ["work.agent.{agent}", "work.edge.{edge}"]
    body: bodies/task.stop.schema.json
    senders: [lead_host, team_services]
    senders_by_address:
      work.edge.{edge}: [lead_host, team_services]
    receivers: [lead_host, worker_host, edge_adapter]
    expiry_seconds: 86400
    authority: optional
    authority_binding: {type: root_task}
    idempotency: [/body/task_id, /body/stop_id]
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: holder
    topology_edge: [down, out]
    ledger: task_stopped
    wakes_model: never
    rendering: none

  agent.pause:
    description: Pause one agent at its next safe point; it keeps its queued work.
    class: request_reply
    address: ctl.agent.{agent}.pause
    body: bodies/agent.pause.schema.json
    reply:
      body: bodies/agent.pause.reply.schema.json
      errors: [agent_exiting]
    senders: [lead_host, team_services]
    receivers: [lead_host, worker_host]
    expiry_seconds: 30
    authority: none
    idempotency: [/audience/id, /body/request_id]
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: named
    topology_edge: down
    ledger: none
    wakes_model: never
    rendering: none

  skills.changed:
    description: Hint that a managed skill was installed or removed. Receivers verify the stored receipt before they refresh.
    class: event
    address: evt.skills_changed
    body: bodies/skills.changed.schema.json
    senders: [lead_host]
    receivers: [lead_host, worker_host]
    expiry_seconds: 300
    authority: none
    idempotency: [/body/change_id]
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: broadcast
    topology_edge: none
    ledger: none
    wakes_model: never
    rendering: none

  # -- durable work --
  task.request:
    description: Give a task to an agent or a pool.
    class: durable
    address: ["work.agent.{agent}", "work.pool.{pool}", "work.edge.{edge}"]
    copy_to: [work.team]
    body: bodies/task.request.schema.json
    senders: [gateway, lead_host, scheduler, edge_adapter, team_services]
    senders_by_address:
      work.pool.{pool}: [gateway, lead_host, scheduler, team_services]
      work.edge.{edge}: [lead_host]
    receivers: [lead_host, worker_host, edge_adapter]
    expiry_seconds: 604800
    authority: optional
    authority_binding: {type: root_task, at: /body/work/root_task_id}
    idempotency: [/body/task_id, /message_id]
    admission: {execution_slot: true, accepted_while_paused: false, priority: normal}
    routing: named
    topology_edge: [down, out]
    ledger: task_held
    wakes_model: always
    rendering: full

  task.result:
    description: The final answer of a task, sent by its holder.
    class: durable
    address: ["work.agent.{agent}", "work.edge.{edge}"]
    copy_to: [work.team]
    body: bodies/task.result.schema.json
    senders: [worker_host, lead_host, edge_adapter, team_services]
    senders_by_address:
      work.edge.{edge}: [worker_host, lead_host, team_services]
    receivers: [lead_host, gateway, edge_adapter]
    expiry_seconds: 604800
    authority: none
    idempotency: [/body/task_id, /issuer/agent, /body/outcome/custody_token, /body/sequence]
    admission: {execution_slot: true, accepted_while_paused: false, priority: high}
    routing: requester
    topology_edge: [up, person, out]
    ledger: delegated_resolved
    wakes_model:
      by: outcome.state
      values:
        completed: next_turn
        partial: next_turn
        failed: always
        cancelled: next_turn
        paused: always
        yielded: next_turn
        rejected: always
    rendering: full

  task.question:
    description: A question from a task's holder to the one who can answer it.
    class: durable
    address: ["work.agent.{agent}", "work.edge.{edge}"]
    body: bodies/task.question.schema.json
    body_rules:
      - {unique: /body/purpose/choices, by: choice_id}
      - {unique: /body/purpose/allowed_decisions}
      - {requires: /body/purpose/choices, when: [{at: /body/purpose/allow_free_text, is: false}]}
    senders: [worker_host, lead_host, edge_adapter]
    senders_by_address:
      work.edge.{edge}: [worker_host, lead_host]
    receivers: [lead_host, gateway, edge_adapter]
    expiry_seconds: 604800
    authority: none
    idempotency: [/body/question_id]
    admission: {execution_slot: true, accepted_while_paused: false, priority: normal}
    routing: requester
    topology_edge: [up, person, sideways, out]
    ledger: question_open
    wakes_model: next_turn
    rendering: full

  task.answer:
    description: The answer to one question.
    class: durable
    address: ["work.agent.{agent}", "work.edge.{edge}"]
    body: bodies/task.answer.schema.json
    body_rules:
      - {unique: /body/selected_choice_ids}
      - {any_of: [/body/text, /body/text_file, /body/selected_choice_ids, /body/decision, /body/decision_token]}
    senders: [gateway, lead_host, team_services, worker_host, edge_adapter]
    senders_by_address:
      work.edge.{edge}: [lead_host]
    receivers: [lead_host, worker_host, edge_adapter]
    expiry_seconds: 604800
    authority: optional
    authority_binding: {type: root_task}
    idempotency: [/body/question_id]
    admission: {execution_slot: true, accepted_while_paused: false, priority: high}
    routing: named
    topology_edge: [down, sideways, out]
    ledger: question_answered
    wakes_model: always
    rendering: full

  task.progress:
    description: Where a task stands, from its holder to its requester.
    class: durable
    address: work.agent.{agent}
    copy_to: [work.team]
    body: bodies/task.progress.schema.json
    senders: [worker_host, lead_host, edge_adapter]
    receivers: [lead_host]
    expiry_seconds: 86400
    authority: none
    idempotency: [/body/task_id, /body/custody_token, /body/sequence]
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: requester
    topology_edge: [up]
    ledger: standin_progress
    wakes_model: never
    rendering: summary

  task.steer:
    description: Steering for the holder of one named task.
    class: durable
    address: ["work.agent.{agent}", "work.edge.{edge}"]
    body: bodies/task.steer.schema.json
    senders: [lead_host, team_services]
    senders_by_address:
      work.edge.{edge}: [lead_host, team_services]
    receivers: [worker_host, lead_host, edge_adapter]
    expiry_seconds: 86400
    authority: optional
    authority_binding: {type: root_task}
    idempotency: [/body/task_id, /body/steer_id]
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: holder
    topology_edge: [down, out]
    ledger: steering_received
    wakes_model:
      by: action.type
      values: {hold: never, guidance: always, release: never}
    rendering: full

  task.account:
    description: A held holder's account of where its task stopped.
    class: durable
    address: work.agent.{agent}
    copy_to: [work.team]
    body: bodies/task.account.schema.json
    senders: [worker_host, lead_host]
    receivers: [lead_host]
    expiry_seconds: 86400
    authority: none
    idempotency: [/body/task_id, /body/steer_id, /body/stage/type]
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: requester
    topology_edge: [up]
    ledger: hold_account
    wakes_model: never
    rendering: summary

  task.claimed:
    description: A holder took a task.
    class: durable
    address: work.agent.{agent}
    copy_to: [work.team]
    body: bodies/task.claimed.schema.json
    senders: [worker_host, lead_host, edge_adapter]
    receivers: [lead_host]
    expiry_seconds: 86400
    authority: none
    idempotency: [/body/claim_id]
    admission: {execution_slot: false, accepted_while_paused: false, priority: normal}
    routing: requester
    topology_edge: [up]
    ledger: standin_holder
    wakes_model: never
    rendering: none

  task.handback:
    description: A holder that lost its lease returns a task.
    class: durable
    address: work.agent.{agent}
    copy_to: [work.team]
    body: bodies/task.handback.schema.json
    senders: [worker_host, lead_host]
    receivers: [lead_host]
    expiry_seconds: 604800
    authority: none
    idempotency: [/body/handback_id]
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: requester
    topology_edge: [up]
    ledger: standin_returned
    wakes_model: never
    rendering: summary

  task.report:
    description: A report from a holder to its requester; the lead decides whether a person sees it.
    class: durable
    address: work.agent.{agent}
    body: bodies/task.report.schema.json
    senders: [worker_host, lead_host]
    receivers: [lead_host]
    expiry_seconds: 604800
    authority: none
    idempotency: [/body/report_id]
    admission: {execution_slot: false, accepted_while_paused: false, priority: high}
    routing: requester
    topology_edge: [up]
    ledger: report_received
    wakes_model: next_turn
    rendering: full

  custody.moved:
    description: Tells a former holder that its task moved; later results are kept as late work.
    class: durable
    address: ["work.agent.{agent}", "work.edge.{edge}"]
    body: bodies/custody.moved.schema.json
    senders: [team_services]
    receivers: [worker_host, lead_host, edge_adapter]
    expiry_seconds: 604800
    authority: none
    idempotency: [/body/task_id, /body/custody_token]
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: named
    topology_edge: none
    ledger: custody_lost
    wakes_model: never
    rendering: none

  access.request:
    description: A task asks the team services for access; no model decides it.
    class: durable
    address: work.team
    body: bodies/access.request.schema.json
    body_rules:
      - {requires: /body/what/hours, when: [{at: /body/what/lifetime, is: until}]}
    senders: [worker_host, lead_host]
    receivers: [team_services]
    expiry_seconds: 604800
