# Protocol 1 registry: one entry per message kind and operation.
#
# Each entry states, for one kind:
#   class          durable | request_reply | event   (transport.yaml describes each class)
#   address        the subject after ua.v1.<audience team>.<sender slot>. ; {agent}, {pool} and
#                  {edge} are the audience id, and the address decides the audience target:
#                  agent, pool, edge, team_services (work.team, svc.team.*) or team (evt.*)
#   body           the body schema, under schemas/
#   reply          request/reply only: the reply body schema and the error codes it may carry
#   senders        host roles that may publish it; receivers check them against the issuer's certificate
#   receivers      host roles that may receive it (and so send its reply)
#   expiry_seconds how long after issue a receiver still accepts it (at most its class's max_expiry_seconds)
#   authority      none | optional | required: whether the frame carries an authority token
#   idempotency    how the sender derives the idempotency key
#   admission      execution_slot (needs a free slot), accepted_while_paused, priority
#   routing        requester | holder | team | person | named | broadcast
#   topology_edge  up | down | person | sideways | out | none  (team-topologies.yaml)
#   ledger         the entry the receiver's work ledger records, or none
#   wakes_model    never | always | next_turn
#   rendering      how a model sees it: none | sender_line | summary | full
#   covered_change the store record it changes and whether it needs the version the writer saw
#   copy_to        durable only: further addresses that receive their own copy (each a separate frame)
#   verification   standard (the issuer's certificate), or proof_of_possession (a join, signed by the
#                  key its body presents)
#
# Edit by hand, then run scripts/export_message_contract.py.

protocol: 1.0-pre
signing_domain: universal-agents/message-frame/v1
renew_key_proof_domain: universal-agents/host-renew-key-proof/v1
state_signing_domain: universal-agents/state-record/v1
authority_token_domain: universal-agents/authority-token/v1
frame_schema: frame.schema.json
state_schema: state.schema.json
max_frame_bytes: 262144
max_nesting_depth: 64
authority_token_max_seconds: 604800   # today's signed person context lasts at most 7 days

# Refusals a receiver gives before any handler runs, in the order it checks them.
# "The issuer's certificate" is the host certificate the receiver's trust store holds
# for the issuer's installation, runtime and membership epoch (README, "Who sent it").
verification_refusals:
  - code: too_large
    meaning: the serialized frame is larger than max_frame_bytes
  - code: malformed
    meaning: the frame is not one JSON object, repeats a key, holds a number with a fraction or exponent part, or breaks the frame schema
  - code: unknown_key
    meaning: the trust store holds no certificate for the issuer's installation, runtime and membership epoch that names the issuer's key id and was valid when the frame was issued, or the installation is neither the receiver's nor one it has an agreement with; a join (verification proof_of_possession) must instead name the key it presents in its body, and a key id the trust store already knows must keep its public key
  - code: bad_signature
    meaning: the signature is not the one unpadded base64url spelling of a signature that verifies over the canonical frame with the certificate's key
  - code: bad_digest
    meaning: the body digest does not match the body
  - code: revoked
    meaning: the issuer's certificate, or the certificate that signed the issuer's agent session, is listed in its installation's revocations, whenever it was revoked and whenever the frame says it was issued
  - code: epoch_too_old
    meaning: the issuer's certificate has a membership or revocation epoch below the receiver's minimum for that runtime or installation (request/reply and events only; queued work is judged by the certificate valid when it was issued, and a join by the key it presents)
  - code: wrong_issuer
    meaning: the issuer's revocation epoch or team disagrees with its certificate; or it names an agent without a session, or a session that does not place that agent, of a type the certificate allows, on the signing runtime when the frame was issued; or a reply does not come from the agent and team the request was for
  - code: wrong_sender
    meaning: none of the certificate's roles may send the kind (for a reply, receive its request); or the frame comes from another installation with a kind, class or destination team its agreement does not allow
  - code: wrong_team
    meaning: the frame is for another installation or team
  - code: wrong_audience
    meaning: the frame names another receiver
  - code: subject_mismatch
    meaning: the subject is not ua.v1.<audience team>.<sender slot>.<address> for the kind and audience target, the frame arrived on another subject, or a NATS header copy disagrees with the frame; replies use the audience runtime's inbox and name their request
  - code: expired
    meaning: the receiver's clock, less the clock tolerance, is at or after the frame's expiry or its kind's lifetime
  - code: not_yet_valid
    meaning: the frame's issue or not-before time is more than the clock tolerance ahead of the receiver's clock
  - code: replayed
    meaning: a frame with the same issuer installation, runtime, membership epoch and message id was admitted with other content
  - code: unknown_kind
    meaning: the kind is not in this registry
  - code: invalid_body
    meaning: the body breaks the kind's schema
  - code: bad_authority
    meaning: the frame carries an authority token its kind does not take or lacks one it requires; or the token is not signed by a gateway or scheduler certificate of its own installation, names another team than the issuer's, was not valid when the frame was issued, lasts longer than authority_token_max_seconds, or is bound to another root task or command than the one the receiver holds
  - code: access_denied
    meaning: the receiver's access decision refused the sender
# Refusals of a change to a covered store record (shared by every covered operation).
change_refusals:
  - code: changed_since_read
    meaning: the record changed after the writer read it; carries the current version
  - code: change_conflict
    meaning: another request changed the record; carries the case id and the brief reference
  - code: request_closed
    meaning: the request was stopped or ended
  - code: needs_person_decision
    meaning: the person must decide before the change is saved
  - code: record_busy
    meaning: another request is writing the file or sign-in; carries when to try again
# Roles that hold NATS permissions. Agent roles for topology are in team-topologies.yaml.
host_roles:
  gateway: talks to people through channels and the web
  lead_host: runs a team's lead agent
  worker_host: runs worker agents
  team_services: the team's operations, steering, access and custody services
  edge_adapter: connects outside agents (A2A)
  installation_authority: issues and revokes certificates and authority keys
  scheduler: fires schedules

# Signed records that vouch for keys and agents (state.schema.json). Readers verify each
# one: authority records with the installation's authority keys (their own, or a peer's
# from an agreement), host records with the writer's certificate that was valid when the
# record was written, unless that certificate is revoked. Where a record is stored adds
# no trust. Fields: bucket and key form; signer (authority | host); writers, the host
# roles that may store it (the edge adapter stores unchanged copies of a peer's records
# under the peer's installation id); body; write_rule.
state_records:
  certificate:
    description: A host's membership certificate.
    bucket: UA1_CERTS
    key: "host.<installation>.<runtime>.<membership_epoch>"
    signer: authority
    writers: [installation_authority, edge_adapter]
    body: state/certificate.schema.json
    write_rule: written once; kept until its expiry plus the longest kind lifetime, so queued frames can still be checked
  revocations:
    description: An installation's revoked certificates.
    bucket: UA1_CERTS
    key: "revocations.<installation>"
    signer: authority
    writers: [installation_authority, edge_adapter]
    body: state/revocations.schema.json
    write_rule: rewritten with a higher sequence on each revocation; the revocation epoch only grows and entries are never removed while a revoked certificate could still be named
  agent_session:
    description: An agent session certificate, issued by the team services that place the agent.
    bucket: UA1_CERTS
    key: "session.<installation>.<team>.<session>"
    signer: host
    signer_roles: [team_services]
    writers: [team_services, edge_adapter]
    body: state/agent_session.schema.json
    write_rule: rewritten with a higher sequence to renew it or to record its actual end; kept until its end plus the longest kind lifetime
  agreement:
    description: A federation agreement with another installation.
    bucket: UA1_CERTS
    key: "agreement.<peer>"
    signer: authority
    writers: [installation_authority]
    body: state/agreement.schema.json
    write_rule: rewritten with a higher sequence to change or end it; only the receiver's own authority signs it
  host:
    description: A runtime host's liveness and capacity, written by the host itself every 20 seconds.
    bucket: UA1_HOSTS
    key: "<runtime>"
    signer: host
    signer_roles: [gateway, lead_host, worker_host, team_services, edge_adapter, installation_authority, scheduler]
    writers: [gateway, lead_host, worker_host, team_services, edge_adapter, installation_authority, scheduler]
    body: state/host.schema.json
    ttl_seconds: 60
    write_rule: written by the host itself every 20 seconds; a host writes only its own record
  agent:
    description: An agent's state, written by the host it is placed on when the state changes.
    bucket: UA1_AGENTS
    key: "<team>.<agent>"
    signer: host
    signer_roles: [lead_host, worker_host]
    writers: [lead_host, worker_host]
    body: state/agent.schema.json
    write_rule: written on change, at most once per 2 seconds; readers accept it only from the placement's host
  placement:
    description: Which host runs an agent; its key-value revision is the fencing token.
    bucket: UA1_PLACEMENT
    key: "<team>.<agent>"
    signer: host
    signer_roles: [team_services]
    writers: [team_services]
    body: state/placement.schema.json
    write_rule: compare-and-set on the last revision; the revision is the fencing token
  team_view:
    description: One entry of a team's shared view of its members, requests, tasks and Objectives.
    bucket: UA1_TEAM_VIEW
    key: "<team>.<entry>.<id>"
    signer: host
    signer_roles: [team_services]
    writers: [team_services]
    body: state/team_view.schema.json
    write_rule: deleted when the item closes; each entry at most 4 KiB

kinds:
  task.stop:
    description: Stop one task. Sent only to the task's current holder.
    class: durable
    address: work.agent.{agent}
    body: bodies/task.stop.schema.json
    senders: [lead_host, team_services]
    receivers: [lead_host, worker_host]
    expiry_seconds: 86400
    authority: optional
    idempotency: "task.stop:<base64url(sha256(RFC8785([task_id, stop_id])))>"
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: holder
    topology_edge: down
    ledger: task_stopped
    wakes_model: never
    rendering: none

  agent.pause:
    description: Pause one agent at its next safe point; it keeps its queued work.
    class: request_reply
    address: ctl.agent.{agent}.pause
    body: bodies/agent.pause.schema.json
    reply:
      body: bodies/agent.pause.reply.schema.json
      errors: [agent_exiting]
    senders: [lead_host, team_services]
    receivers: [lead_host, worker_host]
    expiry_seconds: 30
    authority: none
    idempotency: "agent_pause:<agent>:<request_id>"
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: named
    topology_edge: down
    ledger: none
    wakes_model: never
    rendering: none

  skills.changed:
    description: Hint that a managed skill was installed or removed. Receivers verify the stored receipt before they refresh.
    class: event
    address: evt.skills_changed
    body: bodies/skills.changed.schema.json
    senders: [lead_host]
    receivers: [lead_host, worker_host]
    expiry_seconds: 300
    authority: none
    idempotency: "skills_changed:<change_id>"
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: broadcast
    topology_edge: none
    ledger: none
    wakes_model: never
    rendering: none

  # -- durable work --
  task.request:
    description: Give a task to an agent or a pool.
    class: durable
    address: ["work.agent.{agent}", "work.pool.{pool}"]
    copy_to: [work.team]
    body: bodies/task.request.schema.json
    senders: [gateway, lead_host, scheduler, edge_adapter]
    receivers: [lead_host, worker_host, edge_adapter, team_services]
    expiry_seconds: 604800
    authority: optional
    # A returned task keeps its task id but gets a new dispatch frame. Retries
    # of that dispatch reuse the saved frame, including its message id.
    idempotency: task_request:<task_id>:<message_id>
    admission: {execution_slot: true, accepted_while_paused: false, priority: normal}
    routing: named
    topology_edge: down
    ledger: task_held
    wakes_model: always
    rendering: full

  task.result:
    description: The final answer of a task, sent by its holder.
    class: durable
    address: ["work.agent.{agent}", "work.edge.{edge}"]
    copy_to: [work.team]
    body: bodies/task.result.schema.json
    senders: [worker_host, lead_host, edge_adapter]
    receivers: [lead_host, gateway, edge_adapter, team_services]
    expiry_seconds: 604800
    authority: none
    idempotency: task_result:<task_id>:<custody_token>
    admission: {execution_slot: true, accepted_while_paused: false, priority: high}
    routing: requester
    topology_edge: up
    ledger: delegated_resolved
    wakes_model:
      by: outcome.state
      values:
        completed: next_turn
        partial: next_turn
        failed: always
        cancelled: next_turn
        paused: always
        yielded: next_turn
        rejected: always
    rendering: full

  task.question:
    description: A question from a task's holder to the one who can answer it.
    class: durable
    address: ["work.agent.{agent}", "work.edge.{edge}"]
    body: bodies/task.question.schema.json
    senders: [worker_host, lead_host, edge_adapter]
    receivers: [lead_host, gateway, edge_adapter]
    expiry_seconds: 604800
    authority: none
    idempotency: task_question:<question_id>
    admission: {execution_slot: true, accepted_while_paused: false, priority: normal}
    routing: requester
    topology_edge: up
    ledger: question_open
    wakes_model: next_turn
    rendering: full

  task.answer:
    description: The answer to one question.
    class: durable
    address: work.agent.{agent}
    body: bodies/task.answer.schema.json
    senders: [gateway, lead_host, team_services, worker_host]
    receivers: [lead_host, worker_host]
    expiry_seconds: 604800
    authority: optional
    idempotency: question_answer:<question_id>
    admission: {execution_slot: true, accepted_while_paused: false, priority: high}
    routing: named
    topology_edge: down
    ledger: question_answered
    wakes_model: always
    rendering: full

  task.progress:
    description: Where a task stands, from its holder to its requester.
    class: durable
    address: work.agent.{agent}
    body: bodies/task.progress.schema.json
    senders: [worker_host, lead_host, edge_adapter]
    receivers: [lead_host]
    expiry_seconds: 86400
    authority: none
    idempotency: task_progress:<task_id>:<sequence>
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: requester
    topology_edge: up
    ledger: standin_progress
    wakes_model: never
    rendering: summary

  task.steer:
    description: Steering for the holder of one named task.
    class: durable
    address: work.agent.{agent}
    body: bodies/task.steer.schema.json
    senders: [lead_host, team_services]
    receivers: [worker_host, lead_host]
    expiry_seconds: 86400
    authority: optional
    idempotency: task_steer:<task_id>:<steer_id>
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: holder
    topology_edge: down
    ledger: steering_received
    wakes_model:
      by: action.type
      values: {hold: never, guidance: always, release: never}
    rendering: full

  task.account:
    description: A held holder's account of where its task stopped.
    class: durable
    address: work.agent.{agent}
    body: bodies/task.account.schema.json
    senders: [worker_host, lead_host]
    receivers: [lead_host]
    expiry_seconds: 86400
    authority: none
    idempotency: task_account:<task_id>:<steer_id>:<stage>
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: requester
    topology_edge: up
    ledger: hold_account
    wakes_model: never
    rendering: summary

  task.claimed:
    description: A holder took a task.
    class: durable
    address: work.agent.{agent}
    copy_to: [work.team]
    body: bodies/task.claimed.schema.json
    senders: [worker_host, lead_host, edge_adapter]
    receivers: [lead_host, team_services]
    expiry_seconds: 86400
    authority: none
    idempotency: task_claimed:<claim_id>
    admission: {execution_slot: false, accepted_while_paused: false, priority: normal}
    routing: requester
    topology_edge: up
    ledger: standin_holder
    wakes_model: never
    rendering: none

  task.handback:
    description: A holder that lost its lease returns a task.
    class: durable
    address: work.agent.{agent}
    copy_to: [work.team]
    body: bodies/task.handback.schema.json
    senders: [worker_host, lead_host]
    receivers: [lead_host, team_services]
    expiry_seconds: 604800
    authority: none
    idempotency: handback_<sha256>
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: requester
    topology_edge: up
    ledger: standin_returned
    wakes_model: never
    rendering: summary

  task.report:
    description: A report from a holder to its requester; the lead decides whether a person sees it.
    class: durable
    address: work.agent.{agent}
    body: bodies/task.report.schema.json
    senders: [worker_host, lead_host]
    receivers: [lead_host]
    expiry_seconds: 604800
    authority: none
    idempotency: task_report:<report_id>
    admission: {execution_slot: false, accepted_while_paused: false, priority: high}
    routing: requester
    topology_edge: up
    ledger: report_received
    wakes_model: next_turn
    rendering: full

  custody.moved:
    description: Tells a former holder that its task moved; later results are kept as late work.
    class: durable
    address: work.agent.{agent}
    body: bodies/custody.moved.schema.json
    senders: [team_services]
    receivers: [worker_host, lead_host]
    expiry_seconds: 604800
    authority: none
    idempotency: custody_moved:<task_id>:<custody_token>
    admission: {execution_slot: false, accepted_while_paused: true, priority: high}
    routing: named
    topology_edge: none
    ledger: custody_lost
    wakes_model: never
    rendering: none

  access.request:
    description: A task asks the team services for access; no model decides it.
    class: durable
    address: work.team
    body: bodies/access.request.schema.json
    senders: [worker_host, lead_host]
    receivers: [team_services]
    expiry_seconds: 604800
    authority: optional
    idempotency: access_request:<request_id>
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: team
    topology_edge: none
    ledger: access_wait_open
    wakes_model: never
    rendering: none

  access.decision:
    description: What became of an access request, sent to the waiting task.
    class: durable
    address: work.agent.{agent}
    body: bodies/access.decision.schema.json
    senders: [team_services]
    receivers: [worker_host, lead_host]
    expiry_seconds: 604800
    authority: none
    idempotency: access_decision:<request_id>:<state>
    admission: {execution_slot: false, accepted_while_paused: false, priority: high}
    routing: named
    topology_edge: none
    ledger: access_wait_closed
    wakes_model:
      by: status.state
      values:
        handed_down: always
        waiting: never
        granted: always
        denied: always
        withdrawn: always
        already_held: always
        refused: always
    rendering: none

  access.resolved:
    description: A person's decision on an access request, from the gateway to the team services.
    class: durable
    address: work.team
    body: bodies/access.resolved.schema.json
    senders: [gateway]
    receivers: [team_services]
    expiry_seconds: 604800
    authority: required
    idempotency: access_res:<request_id>
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: team
    topology_edge: none
    ledger: none
    wakes_model: never
    rendering: none

  person.notify:
    description: A notice for a person, delivered by the gateway.
    class: durable
    address: work.edge.{edge}
    body: bodies/person.notify.schema.json
    senders: [lead_host, worker_host, team_services]
    receivers: [gateway]
    expiry_seconds: 604800
    authority: optional
    idempotency: notify:<notice_id>
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: person
    topology_edge: person
    ledger: person_notified
    wakes_model: never
    rendering: none

  delivery.receipt:
    description: The gateway delivered an answer or notice to a person.
    class: durable
    address: work.team
    body: bodies/delivery.receipt.schema.json
    senders: [gateway]
    receivers: [team_services]
    expiry_seconds: 604800
    authority: none
    idempotency: "<receipt_id>"
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: team
    topology_edge: none
    ledger: none
    wakes_model: never
    rendering: none

  delivery.refused:
    description: A receiver refused a message; sent back to its sender.
    class: durable
    address: ["work.agent.{agent}", "work.edge.{edge}", work.team]
    body: bodies/delivery.refused.schema.json
    senders: [lead_host, worker_host, team_services, gateway, edge_adapter]
    receivers: [lead_host, worker_host, team_services, gateway, edge_adapter]
    expiry_seconds: 86400
    authority: none
    idempotency: refused:<message_id>
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: sender
    topology_edge: none
    ledger: send_refused
    wakes_model: never
    rendering: summary

  credential.form.request:
    description: Ask the gateway to collect, set up or delete a credential through a secure form.
    class: durable
    address: work.edge.{edge}
    body: bodies/credential.form.request.schema.json
    senders: [lead_host]
    receivers: [gateway]
    expiry_seconds: 604800
    authority: required
    idempotency: credential_form:<form_id>
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: person
    topology_edge: person
    ledger: form_wait_open
    wakes_model: never
    rendering: none

  credential.form.result:
    description: What became of a credential form.
    class: durable
    address: work.agent.{agent}
    body: bodies/credential.form.result.schema.json
    senders: [gateway]
    receivers: [lead_host]
    expiry_seconds: 604800
    authority: none
    idempotency: secure_result:credential_form:<form_id>
    admission: {execution_slot: true, accepted_while_paused: false, priority: normal}
    routing: requester
    topology_edge: person
    ledger: form_wait_closed
    wakes_model: next_turn
    rendering: summary

  tool.setup.request:
    description: Ask the gateway to have a person or administrator set a tool up.
    class: durable
    address: work.edge.{edge}
    body: bodies/tool.setup.request.schema.json
    senders: [lead_host]
    receivers: [gateway]
    expiry_seconds: 604800
    authority: required
    idempotency: "<setup_request_id>"
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: person
    topology_edge: person
    ledger: setup_wait_open
    wakes_model: never
    rendering: none

  tool.setup.result:
    description: What became of a tool setup.
    class: durable
    address: work.agent.{agent}
    body: bodies/tool.setup.result.schema.json
    senders: [gateway]
    receivers: [lead_host]
    expiry_seconds: 604800
    authority: none
    idempotency: secure_result:tool_setup:<setup_request_id>
    admission: {execution_slot: true, accepted_while_paused: false, priority: normal}
    routing: requester
    topology_edge: person
    ledger: setup_wait_closed
    wakes_model: never
    rendering: summary

  ledger.fact:
    description: A fact for an agent's work ledger from the team services.
    class: durable
    address: work.agent.{agent}
    body: bodies/ledger.fact.schema.json
    senders: [team_services]
    receivers: [lead_host, worker_host]
    expiry_seconds: 604800
    authority: none
    idempotency: ledger_fact:<fact_id>
    admission: {execution_slot: false, accepted_while_paused: true, priority: normal}
    routing: named
    topology_edge: none
    ledger: fact_recorded
    wakes_model: never
