[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    integration: exercises behavior across multiple runtime components
    live: exercises a real local or remote service boundary
    external: calls an external provider or mutates external authentication state
    nats: requires a live NATS/JetStream server
    postgres: requires a live PostgreSQL server
    docker: requires Docker or manages a container lifecycle
# A turn calls Strands only with keywords Agent.invoke_async declares
# (custom_agents/sdk/strands/turn_tool_stop.py). Strands warns on any other
# keyword and then hands tools and hooks the turn's values one level down.
filterwarnings =
    error:`\*\*kwargs` parameter is deprecating:UserWarning
