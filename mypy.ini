[mypy]
python_version = 3.12
plugins = pydantic.mypy
files =
    *.py,
    access_catalog,
    activity_collector,
    assistant_gateway,
    custom_agents,
    custom_messages,
    custom_tools,
    custom_transport,
    docker,
    mcp,
    mcp_control,
    model_providers,
    runtime_hosting,
    scripts,
    secure_tool_broker,
    secure_tools,
    storage,
    team_transfer,
    user,
    user_docs
exclude = (?x)(^|/)(?:\.venv|node_modules|target|test_results|deleteme)(?:/|$)
strict = True
show_error_codes = True
show_error_context = False
pretty = False
warn_unused_configs = True
cache_dir = .mypy_cache

[pydantic-mypy]
warn_untyped_fields = True
