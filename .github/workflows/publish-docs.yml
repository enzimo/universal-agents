name: Publish Documentation

on:
  pull_request:
  push:
    branches:
      - main
    # Stable release tags only. Pre-release tags (vX.Y.Z-beta.N, -rc.N,
    # -nightly.YYYYMMDDHHMM) contain "-" and never build or publish docs.
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: rtk proxy bash --noprofile --norc -e -o pipefail {0}

jobs:
  build:
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, ua-build, ua-linux]
    timeout-minutes: 15
    steps:
      - name: Require managed local runner
        run: node -e "if (process.env.UA_CI_HOOK_VERSION !== '1' || process.env.UA_CI_BUILD_CACHE_VERSION !== '1') throw new Error('Install the reviewed CI cleanup hooks before running jobs')"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Make disposable Python work with isolated child processes
        run: '"$UA_CI_PYTHON" .github/runner/relocate_python.py'
      - name: Create disposable Python environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          python scripts/validate_release_tag.py "${GITHUB_REF_NAME}"
          kind="$(python scripts/validate_release_tag.py --kind "${GITHUB_REF_NAME}")"
          if [ "${kind}" != "stable" ]; then
            echo "::error title=Pre-release documentation::${GITHUB_REF_NAME} is a ${kind} pre-release. Documentation is built and published only from main or stable release tags."
            exit 1
          fi

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install documentation dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Test setup guide commands
        run: node --test tests/setup_guide.test.cjs

      - name: Test served documentation and guide routes
        run: >-
          python -m pytest -q
          tests/test_user_docs_service.py tests/test_docs_navigation.py
          tests/test_gateway_website_app.py tests/test_gateway_interactive_app_registry.py
          tests/test_docker_compose_setup_html.py tests/test_build_user_docs.py

      - name: Build GitHub Pages artifact
        env:
          UA_DOCS_HOMEPAGE: "${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}/"
          UA_DOCS_SITE_URL: "${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}/"
        run: >-
          python scripts/build_user_docs.py
          --site-dir user_docs/pages
          --github-pages

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: user_docs/pages
          retention-days: 7

  deploy:
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: [self-hosted, Linux, X64, ua-build, ua-linux]
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 15
    steps:
      - name: Require managed local runner
        run: node -e "if (process.env.UA_CI_HOOK_VERSION !== '1' || process.env.UA_CI_BUILD_CACHE_VERSION !== '1') throw new Error('Install the reviewed CI cleanup hooks before running jobs')"
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
