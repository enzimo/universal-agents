name: Security Quality

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docker-compose-setup.html'
      - 'user_docs/**'
      - 'mkdocs.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docker-compose-setup.html'
      - 'user_docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: rtk proxy bash --noprofile --norc -e -o pipefail {0}

jobs:
  security-quality:
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, ua-build, ua-linux]
    timeout-minutes: 30
    steps:
      - name: Require managed local runner
        run: node -e "if (process.env.UA_CI_HOOK_VERSION !== '1' || process.env.UA_CI_BUILD_CACHE_VERSION !== '1') throw new Error('Install the reviewed CI cleanup hooks before running jobs')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Make disposable Python work with isolated child processes
        run: '"$UA_CI_PYTHON" .github/runner/relocate_python.py'
      - name: Create disposable Python environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Ensure pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt,clippy
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Ruff security-sensitive modules
        run: |
          python -m ruff check \
            activity_collector/service.py \
            assistant_gateway/gateway.py \
            assistant_gateway/interactive_apps/telegram.py \
            assistant_gateway/interactive_apps/discord.py \
            assistant_gateway/interactive_apps/whatsapp.py \
            assistant_gateway/interactive_apps/signal.py \
            assistant_gateway/application/commands/ \
            assistant_gateway/application/command_operations.py \
            assistant_gateway/application/interactive_commands.py \
            assistant_gateway/interactive_apps/website.py \
            assistant_gateway/access_inbox.py \
            assistant_gateway/access_setup.py \
            assistant_gateway/mcp_controls.py \
            assistant_gateway/installed_procedures.py \
            custom_agents/agent_catalog.py \
            custom_agents/default_tools.py \
            custom_agents/access_runtime.py \
            custom_agents/access_request_runtime.py \
            access_catalog/ \
            access_control/ \
            knowledge_base/ \
