      - name: Cognitive complexity advisory for changed functions
        continue-on-error: true
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/report_cognitive_complexity.py "${COMPLEXITY_BASE_SHA}"
      - name: Rust source integrity and quality
        run: |
          python scripts/check_vendored_rust.py
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --workspace
          target/debug/ua-cedar-authorizer validate-access \
            --policy ua_definitions/access/cedar/policies.cedar \
            --schema ua_definitions/access/cedar/schema.cedarschema
      - name: Vulture security-sensitive modules
        run: |
