name: Dependency Audit

on:
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
      - '.github/runner/**'
  push:
    branches:
      - main
    paths:
      - 'requirements*.txt'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
      - '.github/runner/**'

  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: rtk proxy bash --noprofile --norc -e -o pipefail {0}

jobs:
  pip-audit:
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, ua-build, ua-linux]
    timeout-minutes: 30
    steps:
      - name: Require managed local runner
        run: node -e "if (process.env.UA_CI_HOOK_VERSION !== '1' || process.env.UA_CI_BUILD_CACHE_VERSION !== '1') throw new Error('Install the reviewed CI cleanup hooks before running jobs')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Make disposable Python work with isolated child processes
        run: '"$UA_CI_PYTHON" .github/runner/relocate_python.py'
      - name: Create disposable Python environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Install hash-locked dependency graph
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Audit requirements
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Audit locked pins
        run: python -m pip_audit -r requirements.lock.txt --no-deps --progress-spinner off
      - name: Audit development pins
        run: python -m pip_audit -r requirements-dev.lock.txt --no-deps --progress-spinner off
      - name: Audit isolated SkillSpector pins
        run: python -m pip_audit -r requirements.skillspector.lock.txt --no-deps --progress-spinner off
      - name: Audit installed dependency graph
        run: python -m pip_audit --local --progress-spinner off

  cargo-audit:
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, ua-build, ua-linux]
    timeout-minutes: 30
    steps:
      - name: Require managed local runner
        run: node -e "if (process.env.UA_CI_HOOK_VERSION !== '1' || process.env.UA_CI_BUILD_CACHE_VERSION !== '1') throw new Error('Install the reviewed CI cleanup hooks before running jobs')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Ensure pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Install pinned Rust audit tool
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit Rust dependencies and maintenance
        # Unmaintained crates remain visible warnings. Vulnerabilities, yanked
        # versions, and unsoundness fail the job. See CONTRIBUTING.md.
        run: cargo audit --deny yanked --deny unsound

  photon-sidecar-audit:
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, ua-build, ua-linux]
    timeout-minutes: 30
    steps:
      - name: Require managed local runner
        run: node -e "if (process.env.UA_CI_HOOK_VERSION !== '1' || process.env.UA_CI_BUILD_CACHE_VERSION !== '1') throw new Error('Install the reviewed CI cleanup hooks before running jobs')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Install Photon sidecar production dependencies
        working-directory: assistant_gateway/interactive_apps/photon_sidecar
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Audit Photon sidecar production dependencies
        working-directory: assistant_gateway/interactive_apps/photon_sidecar
        run: npm audit --omit=dev --audit-level=moderate
