[workspace]
members = ["rust/ua-anydoc-cli", "rust/ua-cedar-authorizer"]
exclude = ["rust/vendor/anydoc-0.1.9", "rust/vendor/calamine-0.36.1"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
version = "0.9.10"

[workspace.dependencies]
anydoc = "=0.1.9"
cedar-policy = "=4.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

# Keep the existing converter API while upstream packages still require zip 8.
# Provenance and the narrow ZIP 9 backport are recorded in rust/vendor/README.md.
[patch.crates-io]
anydoc = { path = "rust/vendor/anydoc-0.1.9" }
calamine = { path = "rust/vendor/calamine-0.36.1" }
