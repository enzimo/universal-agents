[workspace]
members = ["rust/ua-anydoc-cli", "rust/ua-cedar-authorizer"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
version = "0.9.3"

[workspace.dependencies]
anydoc = "=0.1.9"
cedar-policy = "=4.13.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
