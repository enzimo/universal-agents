# instance_config.yaml as onboarding in an earlier version (instance config schema 9)
# wrote it for an instance at /data, the Docker default. Used by
# tests/test_pinned_memory_old_instance.py to check that memory export reads an old
# instance this version refuses to load. It is a fixed snapshot of that version's
# output; keep it unchanged.
schema_version: 9                     # Instance config schema version; generated by onboarding and migration tools.
instance_name: old-team               # Stable instance name used for ids, display defaults, and generated file paths.
instance_root: /data                  # Instance-owned root directory. Relative instance paths resolve under this directory.
state:                                # Manager, task-history, schedule, and heartbeat state settings.
  storage:                                  # Manager/task-history/schedule persistence store.
    backend: sqlite                               # Manager store backend: sqlite or postgres.
    sqlite:                                       # SQLite settings for manager/task-history/schedule data.
      path: /data/workspace/dbs/task_history.db         # Manager/task-history/schedule SQLite DB. Relative paths resolve under agent.workspace_dir.
      vector:                                           # SQLite vector-search settings for memory graph and related retrieval tables.
        enabled: true                                         # Whether SQLite vector indexing is enabled.
        provider: sqlite_vec                                  # SQLite vector provider used by fresh vector-enabled stores.
        require_extension: true                               # Fail memory graph startup if sqlite-vec cannot load.
    postgres: {}                                  # Postgres settings for manager data; connection strings stay in the environment.
transport:                            # NATS/JetStream messaging settings. NATS is the permanent internal transport.
  type: nats                                # NATS/JetStream is the only supported transport.
  nats_url: nats://127.0.0.1:4222           # Single-server URL.
  nats_servers:                             # NATS server URLs.
  - nats://127.0.0.1:4222                   # NATS server URLs.
  jetstream_enabled: true                   # Use JetStream for durable work/reply/presence messages.
  subject_prefix: ''                        # Team subject prefix. Empty uses team_id, e.g. team_303. Use per-team values for external NATS ACLs.
  storage: file                             # JetStream storage: "file" or "memory".
  replicas: 1                               # JetStream stream replica count.
  ack_wait_seconds: 3600.0                  # Delivery ack wait for long-running agent work.
  max_deliver: 5                            # Maximum redelivery attempts before termination.
  duplicate_window_seconds: 600.0           # JetStream duplicate message-id window.
  work_max_age_seconds: 604800.0            # Durable work/reply retention age.
  presence_max_age_seconds: 600.0           # Replayable presence retention age.
  process_consumer_inactive_threshold_seconds: 300.0 # Expiry delay for unbound process-scoped JetStream consumers.
gateway:                              # Gateway routing, Web Chat, request waiting, and gateway-local state settings.
  team_id: team_old                         # Team id used for routing and subject-prefix defaults.
  named_agent_type: TeamArchitect           # Manager agent type the gateway targets.
  request_timeout_seconds: 3600.0           # Seconds to wait for one terminal manager reply before timing out locally.
  response_queue_name: team_old_old-team_user_gateway # Gateway response queue name for manager replies.
  startup_agents:                           # Specialist agent processes supervised at headless startup.
  - named_agent_type: MemReviewAgent        # Specialist agent processes supervised at headless startup.
    count: 1                                      # Number of workers of this agent type to supervise.
    enabled: true                                 # Whether this startup agent entry is active.
  storage:                                  # Gateway-local session, conversation, delivery, and pending-response state store.
    backend: sqlite                               # Gateway-local state backend: sqlite or postgres.
    sqlite:                                       # SQLite settings for gateway-local state.
      path: /data/dbs/gateway_state.db                  # Gateway-local SQLite DB. Relative paths resolve under instance_root.
    postgres: {}                                  # Postgres settings for gateway-local state; connection strings stay in the environment.
  users:                                    # Gateway user registration, link-code, and web-token settings.
    enabled: true                                 # Enable gateway user records and identity linking.
    allow_newuser_registration: true              # Allow new user registration from supported app surfaces.
    link_code_ttl_seconds: 900                    # Link-code lifetime in seconds.
    web_user_invite_ttl_seconds: 900              # One-time Web Chat invitation lifetime in seconds.
    web_user_tokens_enabled: true                 # Enable browser user tokens for authenticated Web Chat sessions.
    web_user_token_ttl_days: 0                    # Browser user-token lifetime in days. 0 disables automatic expiration.
agent:                                # Agent runtime defaults and workspace location.
  schedule_workers:                         # Automatic scheduled-worker eligibility, capacity, timing ceilings and editable defaults; saved default or TeamLead policies authorize individual schedules.
    enabled: true                                 # Enabled setting.
    default_startup_policy_enabled: true          # Use the saved initial specialist catalog to configure missing local schedule startup policies. Grants no tool or credential access.
    eligible_agent_types:                         # TeamLead-managed automatic-start candidates; registered custom specialists may be added through runtime settings. Operator denies still win.
    - WebResearchAgent                            # TeamLead-managed automatic-start candidates; registered custom specialists may be added through runtime settings. Operator denies still win.
    - PersonalAdminAgent                          # TeamLead-managed automatic-start candidates; registered custom specialists may be added through runtime settings. Operator denies still win.
    denied_agent_types: []                        # Denied agent types setting.
    reconcile_interval_seconds: 5.0               # Reconcile interval seconds setting.
    max_auto_workers_per_type: 1                  # Max auto workers per type setting.
    max_auto_workers_per_team: 4                  # Max auto workers per team setting.
    max_launches_per_type_per_hour: 12            # Max launches per type per hour setting.
    max_total_workers_per_team: 32                # Max total workers per team setting.
    max_claim_wait_seconds: 86400.0               # Max claim wait seconds setting.
    max_startup_timeout_seconds: 3600.0           # Max startup timeout seconds setting.
    max_admission_timeout_seconds: 3600.0         # Max admission timeout seconds setting.
    max_launch_attempts_per_occurrence: 2         # Max launch attempts per occurrence setting.
    max_idle_ttl_seconds: 86400.0                 # Max idle ttl seconds setting.
    lease_seconds: 120.0                          # Lease seconds setting.
    lease_loss_wait_timeout_seconds: 1800.0       # Lease loss wait timeout seconds setting.
    max_consecutive_interruptions: 3              # Max consecutive interruptions setting.
    review_interval_seconds: 3600.0               # Review interval seconds setting.
    retention_days: 30                            # Retention days setting.
    defaults:                                     # TeamLead-editable launch rules within the current operator ceilings.
      claim_wait_seconds: 30.0                          # Claim wait seconds setting.
      startup_timeout_seconds: 120.0                    # Startup timeout seconds setting.
      admission_timeout_seconds: 60.0                   # Admission timeout seconds setting.
      max_launch_attempts_per_occurrence: 2             # Max launch attempts per occurrence setting.
      retry_backoff_seconds: 30.0                       # Retry backoff seconds setting.
      launch_when_busy: false                           # Launch when busy setting.
      interrupted_run_skip_window_seconds: 900.0        # Interrupted run skip window seconds setting.
  max_deferred_messages: 100                # Maximum durable deferred admission count; excess work remains with NATS for redelivery.
  workspace_dir: /data/workspace            # Agent workspace root. Relative workspace paths and state.storage SQLite paths resolve here.
  default_request_timezone: America/Chicago # Default request timezone setting.
  memory_graph_enabled: false               # Enable graph-backed memory infrastructure.
  memory:                                   # Pinned-memory hydration, review, and notification settings.
    plugin_manager:                               # Memory plugin coordination before conversation-thread budgeting.
      enabled: true                                     # Coordinate memory hydration before conversation-thread budgeting.
      registry_mode: builtin                            # Built-in repo-owned plugin registry; no arbitrary external loading.
      fail_open: true                                   # Omit failed optional plugins and warn instead of failing the turn.
      emit_plugin_warnings: true                        # Include model-visible warnings for failed pinned memory plugins.
    plugins:                                      # Memory hydration plugin order and per-plugin priority settings.
      order:                                            # Hydration plugin order before priorities.
      - coremem                                         # Hydration plugin order before priorities.
      - usermem                                         # Hydration plugin order before priorities.
      - domain_topic_recall                             # Hydration plugin order before priorities.
      coremem:                                          # Coremem settings.
        enabled: true                                         # Enable this memory plugin.
        priority: 34                                          # Memory plugin rendering priority.
        pinned: true                                          # Pin this memory plugin output during context budgeting.
        degradable: false                                     # Allow this memory plugin output to be omitted during context pressure.
      usermem:                                          # Usermem settings.
        enabled: true                                         # Enable this memory plugin.
        priority: 35                                          # Memory plugin rendering priority.
        pinned: true                                          # Pin this memory plugin output during context budgeting.
        degradable: false                                     # Allow this memory plugin output to be omitted during context pressure.
      domain_topic_recall:                              # Domain topic recall settings.
        enabled: true                                         # Enable this memory plugin.
        priority: 44                                          # Memory plugin rendering priority.
        pinned: false                                         # Pin this memory plugin output during context budgeting.
        degradable: true                                      # Allow this memory plugin output to be omitted during context pressure.
    coremem:                                      # Team-scoped pinned memory commands, tools, and hydration settings.
      enabled: true                                     # Enable team-scoped pinned memory commands/tools/hydration.
      max_facts_per_team: 200                           # Hard active coremem capacity per team.
      max_metadata_chars: 2000                          # Maximum serialized metadata JSON length per coremem fact.
      max_tags: 20                                      # Maximum tag count per coremem fact.
      max_tag_chars: 64                                 # Maximum normalized tag length per coremem tag.
      hydrate_into_context: true                        # Hydrate active coremem into every applicable turn.
      automatic_creation_enabled: true                  # Allow MemReview to automatically create/reconcile coremem facts.
      agent_write_tools_enabled: true                   # Allow agent tools to write coremem; slash commands still work when false.
    usermem:                                      # Canonical-user-scoped pinned memory commands, tools, and hydration settings.
      enabled: true                                     # Enable canonical-user-scoped pinned memory commands/tools/hydration.
      max_facts_per_user: 500                           # Hard active usermem capacity per canonical user.
      require_canonical_user_id: true                   # Skip usermem hydration when the requester is not registered.
      max_metadata_chars: 2000                          # Maximum serialized metadata JSON length per usermem fact.
      max_tags: 20                                      # Maximum tag count per usermem fact.
      max_tag_chars: 64                                 # Maximum normalized tag length per usermem tag.
      hydrate_into_context: true                        # Hydrate active usermem into every applicable registered-user turn.
      automatic_creation_enabled: true                  # Allow MemReview to automatically create/reconcile usermem facts.
      agent_write_tools_enabled: true                   # Allow agent tools to write usermem; slash commands still work when false.
    review:                                       # Memory review maintenance boundaries and MemReview job settings.
      enabled: true                                     # Enable memory review maintenance boundaries and MemReview job enqueueing.
      mode: cue_plus_periodic                           # Review scheduling policy for pinned-memory review jobs.
      periodic_turn_interval: 15                        # Maximum unreviewed completed user turns before submitting a conversation review window.
      sliding_window_overlap_turns: 5                   # Already-reviewed turns included before the first unreviewed turn for review continuity.
      explicit_cue_immediate: true                      # Allow explicit "remember" style cues to submit a partial window before the interval fills.
      max_turn_text_chars: 4000                         # Per-turn text field cap inside MemReview conversation-window payloads.
      stale_conversation_after_seconds: 86400           # Inactivity age before remaining unreviewed turns are considered stale.
      max_stale_conversations_per_run: 20               # Maximum stale conversations submitted per scheduled stale-review scan.
      stale_conversation_review_interval_seconds: 3600  # Recurring scan interval for stale conversations with unreviewed turns.
      coremem_audit_interval_seconds: 86400             # Recurring interval for scheduled coremem validity/conflict audits.
      usermem_audit_interval_seconds: 86400             # Recurring interval for scheduled usermem validity/conflict audits.
      claim_ttl_seconds: 300                            # Review-job claim TTL used by MemReview workers.
      memreview_agent_count: 2                          # Default managed MemReview worker count.
      review_task_ttl_seconds: 14400                    # MemReview task NATS TTL in seconds.
    notifications:                                # Memory and topic notice delivery settings.
      quiet_hours_aware: true                           # Route memory/topic notices through quiet-hours-aware gateway delivery.
      active_engagement_grace_seconds: 300              # Grace window for treating a source conversation as actively engaged.
      delivery_target: default                          # notify_user target used for memory/topic notices: default or current_thread.
    domain:                                       # Tagged-thread topic recall and topic command settings.
      enabled: true                                     # Enable tagged-thread topic recall and topic command surfaces.
      auto_tag_threads: true                            # Allow maintenance plugins to tag threads from explicit topic signals.
      visible_notices: true                             # Allow user-visible topic/memory notices where delivery policy permits.
      max_recall_threads: 5                             # Maximum compact thread hints inserted by domain_topic_recall.
  schedule_maintenance:                     # Manager-owned recurring internal-maintenance schedule settings.
    internal_improvement_review_interval_seconds: 21600 # InternalImprovement review cadence in seconds; each worker startup ensures one shared team schedule and non-positive disables installation.
    memory_review_cleanup:                        # Set abandoned review claims aside for InternalImprovementAgent; archive and deletion remain permission-checked.
      enabled: true                                     # Enable the abandoned memory-review claim scan.
      scan_interval_seconds: 300                        # Seconds between abandoned-claim scans.
      expired_claim_grace_seconds: 3600                 # Additional seconds after claim expiry before setting an abandoned review aside.
      batch_size: 100                                   # Maximum reviews handled per scan or authorized maintenance operation.
      archive_retention_days: 90                        # Minimum days to keep archived review content before authorized deletion.
  max_queued_top_level_tasks: 50            # Maximum admitted top-level tasks tracked at once.
  max_concurrent_top_level_tasks: 1         # Top-level execution parallelism per agent. Keep at 1 unless audited for higher concurrency.
  task_queue_warning_threshold: 5           # Warn when pending top-level task count reaches this threshold.
  subtask_timeout_seconds: 1200.0           # Local timeout for delegated subtasks and unanswered TaskQuery waits.
  subtask_watchdog_interval_seconds: 15.0   # Watchdog scan interval for overdue subtasks and TaskQuery waits.
  subtask_status_probe_timeout_seconds: 5.0 # Per-probe timeout for delegated-subtask status checks.
  restart_executing_task_grace_seconds: 900.0 # Restart grace for interrupted executing snapshots before failing fast.
  same_role_runtime_takeover_enabled: true  # Same-role replacement agents may claim stale runtime snapshots.
  max_tool_calls_per_task: 150              # Cumulative tool calls across one ordinary local task-processing invocation, not per model turn. Accepted Objective work profiles use their own session total. Set null or <=0 to disable.
  max_tool_result_tokens_per_call: 20000    # Per-tool-result token safety cap. Oversized results are offloaded to artifacts.
  runtime_budget_policy:                    # Policy for recoverable runtime budget/overload pauses.
    mode: user_guided                             # "hard_stop" fails visibly; "user_guided" pauses and asks the requester.
    partial_tool_call_budget_multiplier: 1.5      # Temporary tool-call budget multiplier when requester asks for partial results.
    max_user_guided_pauses_per_task: 3            # Maximum user-guided pauses before falling back to hard-stop behavior.
    triggers:                                     # Recoverable conditions that may pause instead of immediately failing.
      tool_call_budget_exceeded: true                   # Tool-call budget exceeded.
      context_budget_exceeded: true                     # Prompt/context budget exceeded.
      delegated_subtask_timeout: true                   # Delegated subtask timeout.
      specialist_runtime_budget_pause: true             # Specialist agent runtime budget pause.
      provider_overloaded: true                         # Provider overload / 429 when failover cannot handle it.
  turn_action_outbox:                       # Durable ordered action outbox for StructuredAgentTurnDecision side effects.
    max_auto_attempts: 4                          # Automatic retries for infrastructure-safe action failures.
    initial_retry_delay_seconds: 2.0              # Initial automatic retry delay in seconds.
    max_retry_delay_seconds: 60.0                 # Maximum automatic retry delay in seconds.
    retry_jitter_ratio: 0.15                      # Jitter ratio applied to retry delays.
    max_inline_recovery_attempts_per_batch: 2     # Inline model-recovery attempts before isolated recovery.
    max_validation_repair_attempts: 1             # Reserved bounded validation-repair attempts for structured action output.
    dispatching_stale_after_seconds: 30.0         # Restart normalization threshold for stale dispatching records.
  delegation_assurance:                     # Worker-capacity assurance after durable delegated-task publish.
    enabled: true                                 # Verify/create worker capacity after delegation publish.
    min_live_agents: 1                            # Minimum live same-type workers desired for a delegated queue.
    create_if_missing: true                       # Ask the runtime to create a worker when none are live.
    check_delay_seconds: 15.0                     # Delay before scheduled follow-up assurance check.
    max_attempts: 4                               # Maximum assurance checks before recovery.
    max_assurance_seconds: 180.0                  # Overall assurance window in seconds.
    on_failure: model_recovery                    # Recovery mode after assurance exhaustion.
  runtime_coordinator:                      # Coordinates active action batches and defers conflicting inbound events.
    enabled: true                                 # Master switch for task-tree leases/mailbox deferral.
    mode: enforced                                # "enforced" defers conflicts; "observe" logs diagnostics; "disabled" handles events directly.
    batch_lease_stale_after_seconds: 60.0         # Stale lease threshold in seconds.
    max_deferred_events_per_task: 500             # Maximum deferred mailbox events per task tree.
    max_mailbox_drain_events_per_pass: 100        # Maximum mailbox events replayed in one drain pass.
    mailbox_event_retention_seconds: 86400.0      # Retain processed/stale/rejected mailbox events for this many seconds.
    check_interrupts_between_actions: true        # Check stop/cancel controls between ordered actions.
    defer_scheduled_events_during_active_batch: true # Defer scheduled events while an action batch owns the task tree.
    defer_task_responses_during_active_batch: true # Defer task responses while an action batch owns the task tree.
    defer_recovery_events_during_active_batch: true # Defer recovery events while an action batch owns the task tree.
  mid_turn_steering:                        # Mid turn steering settings.
    enabled: true                                 # Enabled setting.
    proactive_guidance_ttl_seconds: 1800.0        # Proactive guidance ttl seconds setting.
    interrupt_response_timeout_seconds: 86400.0   # Interrupt response timeout seconds setting.
    allow_restart_fallback: true                  # Allow restart fallback setting.
    apply_proactive_guidance_before_tools: true   # Apply proactive guidance before tools setting.
    apply_proactive_guidance_after_model: true    # Apply proactive guidance after model setting.
  inner_loop_context:                       # Active Strands transcript management before model calls.
    enabled: true                                 # Enable filtering/offloading of historical tool-result transcript.
    max_total_tokens: 300000                      # Main active-transcript token budget.
    warning_ratio: 0.75                           # Emit a model-visible warning at this fraction of max_total_tokens.
    aggressive_ratio: 0.9                         # Start aggressive artifact-only reduction at this fraction.
    preserve_recent_messages: 8                   # Preserve recent messages from aggressive reduction where possible.
    preserve_head_tokens: 1000                    # Head excerpt tokens retained for filtered noisy results.
    preserve_tail_tokens: 1000                    # Tail excerpt tokens retained for filtered noisy results.
    offload_dir: artifacts/tool_results           # Workspace-relative directory for full offloaded tool-result artifacts.
    projected_token_pressure:                     # Proactive old-tool-result reduction based on projected input tokens.
      enabled: true                                     # Enable proactive old-tool-result reduction based on projected tokens.
      threshold_ratio: 0.85                             # Trigger when projected input reaches this context-window ratio.
      target_ratio: 0.75                                # Target projected context-window ratio after reduction.
    reactive_overflow:                            # Bound reactive transcript reduction and provider reinvocation after a context rejection.
      max_total_recovery_attempts: 3                    # Shared per-request ceiling for inner reductions and outer provider reinvocations.
      min_reduction_tokens: 1                           # Minimum measured message-token reduction required before retrying the provider.
    filters:                                      # Built-in filters for noisy historical tool output.
      html_document:                                    # Html document settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 2000                                  # Token threshold that activates this historical tool-output filter.
      javascript_or_bundle:                             # Javascript or bundle settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 1000                                  # Token threshold that activates this historical tool-output filter.
      css_or_style_blob:                                # Css or style blob settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 2000                                  # Token threshold that activates this historical tool-output filter.
      base64_or_binary_like:                            # Base64 or binary like settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 500                                   # Token threshold that activates this historical tool-output filter.
      minified_or_low_entropy_noise:                    # Minified or low entropy noise settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 750                                   # Token threshold that activates this historical tool-output filter.
      json_large:                                       # Json large settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 3000                                  # Token threshold that activates this historical tool-output filter.
        comms_json_lenient: true                              # Use lenient handling for comms-shaped JSON.
        comms_json_trigger_tokens: 20000                      # Higher token threshold for comms-shaped JSON.
      xml_or_svg:                                       # Xml or svg settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 2000                                  # Token threshold that activates this historical tool-output filter.
      log_or_trace:                                     # Log or trace settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 750                                   # Token threshold that activates this historical tool-output filter.
      csv_or_table:                                     # Csv or table settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 2500                                  # Token threshold that activates this historical tool-output filter.
      html_boilerplate_text:                            # Html boilerplate text settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 1000                                  # Token threshold that activates this historical tool-output filter.
      agent_transcript:                                 # Agent transcript settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 1500                                  # Token threshold that activates this historical tool-output filter.
      code_file:                                        # Code file settings.
        enabled: true                                         # Enable this historical tool-output filter.
        trigger_tokens: 30000                                 # Token threshold that activates this historical tool-output filter.
  context_engine:                           # Outer-loop prompt assembly, durable context, and context-budget enforcement.
    type: default                                 # Context engine implementation. Only "default" is currently supported.
    max_context_ratio: 0.85                       # Soft prompt-input budget ratio after reserving output tokens.
    reserved_output_tokens: 55296                 # Output headroom subtracted from llm.context_window_tokens.
    hard_limit_behavior: recover_then_error       # Overflow behavior. "recover_then_error" tries bounded recovery first.
    overflow_recovery:                            # Bounded recovery when prompt assembly or provider call exceeds context.
      enabled: true                                     # Enable context-epoch/degraded-section recovery.
      max_preflight_attempts: 2                         # Maximum prompt preflight recovery attempts.
      max_provider_retry_attempts: 1                    # Maximum provider-overflow retry attempts after provider rejects context.
      degrade_sections:                                 # Lower-priority sections that may be omitted during recovery only.
      - task_runtime_timing                             # Lower-priority sections that may be omitted during recovery only.
      - domain_topic_recall                             # Lower-priority sections that may be omitted during recovery only.
      - task_history                                    # Lower-priority sections that may be omitted during recovery only.
      - workspace_user_context                          # Lower-priority sections that may be omitted during recovery only.
      - instance_delivery_context                       # Lower-priority sections that may be omitted during recovery only.
    context_epochs:                               # Durable conversation context-boundary summaries.
      enabled: true                                     # Enable context epoch records.
      auto_create: true                                 # Create epochs automatically when needed.
      summary_max_tokens: 5000                          # Maximum epoch summary token budget.
      include_source_accounting: true                   # Store/render source accounting with epoch summaries.
    strands_state_snapshots:                      # Optional future Strands-native snapshots. These are not canonical durable context.
      enabled: auto                                     # "auto" feature-detects SDK snapshot support.
      persist: false                                    # Persist SDK snapshots when supported. false keeps this diagnostic-only.
    plugins: []                                   # Optional context lifecycle plugins.
    thread_window:                                # Conversation-thread rendering controls.
      recent_full_turns: 4                              # Recent conversation turns kept in full when budget permits.
      per_turn_summary_max_tokens: 400                  # Summary budget for older turns.
      max_turns_to_load: 100                            # Maximum turns loaded from durable conversation storage.
      omitted_notice_enabled: true                      # Include notice when older turns are omitted.
      include_turn_ids: true                            # Include durable turn ids in rendered context.
      retrieval_tool_hint: true                         # Include hint for get_conversation_context_slice retrieval.
    task_runtime_timing:                          # Compact lifecycle timing added to model-visible context.
      enabled: true                                     # Enable timing section.
      include_message_created_at: true                  # Include original message-created timestamp.
      include_handled_at: true                          # Include local handled-at timestamp.
      include_processing_started_at: true               # Include local processing-start timestamp.
      include_processing_finished_at: false             # Include processing-finished timestamp when available.
  debug:                                    # Optional context and runtime diagnostics.
    context_dump:                                 # Model-visible context/runtime trace dump settings.
      enabled: false                                    # Enable model-visible context/runtime trace dumps.
      mode: on_error                                    # Dump mode: always, on_error, or on_budget_warning.
      output_dir: artifacts/context_dumps               # Workspace-relative output directory.
      include_system_prompt: true                       # Include the full system prompt file/rendering.
      include_full_prompt: true                         # Include full assembled prompt.
      include_context_sections: true                    # Include context sections as structured JSON.
      include_source_lengths: true                      # Include per-source size accounting.
      include_incoming_envelope_json: false             # Include full incoming envelope JSON. Usually keep false for sensitivity/noise.
      include_strands_messages: true                    # Include Strands message snapshots.
      include_tool_results: true                        # Include tool-result diagnostics.
      include_result: true                              # Include parsed/returned result data.
      include_reasoning_artifacts: true                 # Include observable reasoning artifacts, not hidden chain-of-thought.
      capture_model_calls: false                        # Opt in to per-provider-call accounting through feature-detected Strands middleware.
      include_model_call_inputs: false                  # Include redacted messages, system prompt, and tool-choice snapshots in model-call details.
      include_tool_specs: false                         # Include redacted full tool schemas in model-call details; compact schema-size accounting is always captured.
      redact_secrets: true                              # Redact secret-looking values in dumps.
      retention_days: 14                                # Best-effort dump retention in days.
      web_chat_controls_enabled: false                  # Show authenticated Web Chat controls for live context dump toggles.
    reply_routing_trace:                          # Reply routing trace settings for temporary diagnostics.
      enabled: true                                     # Trace reply routing boundaries for temporary diagnostics.
    terminal_reasoning:                           # Local terminal display for provider-exposed reasoning deltas.
      enabled: false                                    # Print provider-exposed reasoning deltas to stderr when callbacks include them.
  structured_output_failure_threshold: 4    # Optional threshold for stopping repeated structured-output validation failures.
  deferred_message_warning_threshold: 10    # Warn when deferred inbound delivery backlog reaches this count.
  conversation_compactor:                   # Conversation compaction policy for durable conversation history.
    type: heuristic_sliding_window                # Compactor implementation: heuristic_sliding_window, llm_summarizing, or noop.
    options:                                      # Compactor tuning options.
      trigger_ratio: 0.75                               # Trigger compaction when the configured ratio is reached.
      target_ratio: 0.5                                 # Target ratio after compaction.
      min_recent_turns: 3                               # Minimum recent turns to preserve.
      max_recent_turns: 8                               # Maximum recent turns to preserve.
  conversation_summary_generator_type: heuristic # Durable per-turn summary generator. "heuristic" is deterministic; "llm_summarizing" uses model summaries with fallback.
  tool_blocklist: []                        # Optional exact tool-name blocklist applied after allowlist filtering.
  external_mcp_servers: []                  # Static named MCP servers attached at startup; empty global values attach none, and servers continue without tools on connection failure unless continue_on_error is false.
  agent_definition_paths: []                # Additional YAML agent-definition files or directories. Relative paths resolve under agent.workspace_dir.
  prompt_skill_description_exclusions: []   # Skill names hidden from AgentSkills menu/XML prompt content.
  prompt_skill_description_limit: 50        # Maximum deduplicated skill descriptions shown in the AgentSkills prompt menu; all discovered skills remain activatable.
workspace:                            # Workspace-owned directories and operator-editable runtime assets.
  skills_dir: skills                        # Workspace-owned local and startup-refreshed skills directory. Reviewed chat installations use protected runtime storage.
  objective_execution_enabled: true         # Make bounded Objective execution profiles available for explicit per-Objective activation.
  objective_execution_paths:                # Ordered built-in policy URIs or separate bounded Objective execution policy paths.
  - builtin://objective-execution/default   # Ordered built-in policy URIs or separate bounded Objective execution policy paths.
  skill_installation:                       # Skill installation settings.
    enabled: true                                 # Allow TeamArchitect to stage reviewed skills from public GitHub repositories.
    scanner_executable: skillspector              # Operator-owned SkillSpector executable name or absolute path.
    scanner_timeout_seconds: 180                  # Maximum static scan runtime.
    safe_max_score: 20                            # Maximum SkillSpector score accepted as SAFE; cannot exceed 20.
    plan_ttl_seconds: 1800                        # Lifetime of an immutable scanned installation plan.
    max_repository_bytes: 104857600               # Maximum quarantined Git repository size.
  external_skill_repositories: []           # Public GitHub repositories containing skills directories at any depth that can be refreshed before agent startup.
  refresh_external_skills_on_start: false   # Refresh configured external skill repositories before agents start.
  python_envs_dir: python_envs              # Python environment directory. Relative paths resolve under agent.workspace_dir.
  llm_override_path: LLM_OVERRIDES.yaml     # LLM override file. Relative paths resolve under agent.workspace_dir.
  team_templates_path: TEAM_TEMPLATES.yaml  # Team template file. Relative paths resolve under agent.workspace_dir.
  team_composition_path: TEAM_AGENTS.yaml   # Team composition file. Relative paths resolve under agent.workspace_dir.
assistant:                            # Assistant-facing profile defaults.
  display_name: Assistant                   # Assistant display name shown in user-facing surfaces.
  manager_transition_notices_enabled: false # Emit proactive manager outage/recovery messages into the configured delivery channel.
  unavailable_message_template: '{assistant_name} is not currently available. Please try again after it reconnects.' # Manager-unavailable message template. Supports {assistant_name}.
  available_message_template: '{assistant_name} is now available.' # Manager-available message template. Supports {assistant_name}.
user:                                 # Human user profile defaults.
  display_name: User                        # Human display name used for bootstrap context.
  canonical_user_id: User                   # Stable user id used for canonical user memory and identity records.
  timezone: UTC                             # IANA timezone used to interpret relative dates when requests omit one.
  default_session_key: default              # Default gateway session key for local or unscoped interactions.
  role: ''                                  # Optional user role/context label rendered into bootstrap guidance.
  initial_context: ''                       # Initial context setting.
network:                              # Browser-facing network origin and advertised service ports.
  public_origin: http://127.0.0.1           # Browser-facing http(s) origin without a path; service ports are appended separately.
delivery:                             # Notification delivery, quiet-hour, and digest defaults.
  quiet_hours:                              # Quiet-hours policy for proactive delivery.
    enabled: true                                 # Defer non-urgent proactive delivery during quiet hours.
    start_hour_local: 22                          # Local quiet-hours start, 0-23.
    end_hour_local: 8                             # Local quiet-hours end, 0-23.
    allow_urgent_delivery: true                   # Urgent messages can bypass quiet-hours deferral.
  digest_delivery_hour_local: 8             # Local hour to release deferred-message digests.
  default_target:                           # Preferred user communication target.
    channel_name: telegram                        # Preferred channel, e.g. cli, telegram, discord, or whatsapp.
    chat_id: ''                                   # Preferred destination id as a string. Quote negative Telegram ids.
    thread_id: ''                                 # Optional Discord thread id or Telegram forum topic id as a string.
  notification_routing:                     # Routing policy for agent UserNotification messages.
    mode: source_thread_or_default                # How notify_user target='auto' routes: source_thread_or_default or default_target.
  summarize_deferred: true                  # Summarize deferred messages before digest delivery.
  urgent_keywords:                          # Keywords that bypass quiet hours.
  - urgent                                  # Keywords that bypass quiet hours.
  - asap                                    # Keywords that bypass quiet hours.
  - immediately                             # Keywords that bypass quiet hours.
  - critical                                # Keywords that bypass quiet hours.
  - failure                                 # Keywords that bypass quiet hours.
  - error                                   # Keywords that bypass quiet hours.
heartbeat:                            # Heartbeat schedule and source settings.
  enabled: true                             # Enable recurring heartbeat prompts.
  interval_seconds: 1800                    # Heartbeat interval in seconds.
  session_key: heartbeat                    # Gateway session key used for heartbeat output.
  source_id: hb_source_old-team             # Persistent heartbeat source id.
  schedule_id: hb_sched_old-team            # Persistent heartbeat launcher schedule id.
  active_hours_enabled: false               # Restrict heartbeat delivery to active hours.
  active_start_hour_local: 8                # Local active-hours start, 0-23.
  active_end_hour_local: 18                 # Local active-hours end, 0-23.
llm:                                  # Default model, provider, and inference behavior.
  provider: litellm                         # Main chat/reasoning model provider.
  model_id: deepseek/deepseek-v4.1-flash    # Main chat/reasoning model id.
  temperature: 0.0                          # Sampling temperature for providers that support it. OpenAI GPT-5/o-series and OpenAI Codex routes omit this unsupported parameter.
  reasoning_effort: medium                  # Optional reasoning-effort hint translated to the selected provider transport.
  context_window_tokens: 800000             # Explicit context-window size used for prompt budgeting and compaction.
  max_output_tokens: 55296                  # Optional provider-supported cap on generated output tokens.
  litellm_api_mode: chat_completions        # Request API used by the litellm provider path: chat_completions for broad compatibility or responses for a Responses-capable endpoint.
  request_timeout_seconds: 120.0            # Maximum duration of a runtime model-switch probe and one LiteLLM completion request.
  model_capabilities:                       # Provider/model-specific capability facts keyed by provider and model id.
    litellm:                                      # Litellm settings.
      minimax/minimax-m3:                               # Minimax/minimax m3 settings.
        supports_image_input: true                            # Supports image input setting.
  reasoning_trace_retention_messages: 96    # Later-message retention window for full provider reasoning traces after tool-call turns.
  litellm_api_base: https://openrouter.ai/api/v1 # Chat Completions-compatible base URL used by the litellm provider path. This may be OpenRouter, another compatible service, or a LiteLLM proxy.
  openai_codex:                             # OpenAI Codex OAuth provider settings. Used only when llm.provider is openai-codex.
    base_url: https://chatgpt.com/backend-api/codex # OpenAI Codex backend base URL.
    allow_shared_codex_auth_read: true            # Allow read-only access to file-based Codex CLI auth when no owned auth store is available.
    refresh_skew_seconds: 120                     # Refresh owned Codex OAuth tokens this many seconds before JWT expiry.
    refresh_timeout_seconds: 20.0                 # HTTP timeout for Codex OAuth token refresh requests.
    model_discovery:                              # Codex OAuth model discovery and cache settings.
      enabled: true                                     # Enable live Codex model discovery for status/onboarding suggestions.
      cache_ttl_seconds: 3600                           # How long cached Codex model discovery results are considered fresh.
      client_version: 1.0.0                             # Client version query parameter sent to the Codex models endpoint.
  xai_oauth:                                # xAI Grok OAuth provider settings. Used only when llm.provider is xai-oauth.
    base_url: https://api.x.ai/v1                 # xAI Responses API base URL; HTTPS x.ai origins only.
    refresh_skew_seconds: 3600                    # Maximum proactive refresh window for xAI OAuth access tokens.
    refresh_timeout_seconds: 20.0                 # HTTP timeout for xAI OAuth discovery, device login, and token refresh requests.
  failover:                                 # Runtime-owned model-provider failover policy.
    enabled: false                                # Master switch for cross-provider failover. false keeps same-provider behavior.
    same_provider_retry:                          # Same-provider throttling retry configuration used before cross-provider failover.
      max_attempts: 2                                   # Total same-provider model attempts before cross-provider failover.
      initial_delay_seconds: 2                          # Delay before the first same-provider retry, in seconds.
      max_delay_seconds: 10                             # Maximum retry delay, in seconds.
    switch_for:                                   # Minimum lease duration for a selected fallback.
      min_turns: 3                                      # Minimum successful model turns to keep using the fallback.
      min_seconds: 900                                  # Minimum seconds to keep using the fallback.
    demotion:                                     # Historical failure demotion. Repeated failures push a provider behind healthy alternatives.
      failure_threshold: 3                              # Failure count that triggers demotion.
      failure_window_seconds: 3600                      # Rolling failure window in seconds.
      demotion_seconds: 86400                           # Demotion duration in seconds.
    history_retention_seconds: 604800             # Retain provider success/failure history for this many seconds.
    notify_user: true                             # Emit user-visible activity and task-history entries when switching.
    fallbacks: []                                 # Ordered fallback provider/model candidates.
embedding:                            # Embedding provider and model settings.
  provider: openai_compatible               # Embedding backend: local or openai_compatible.
  model_id: harrier-oss-v1-0.6b             # Embedding model id. Required for openai_compatible.
  timeout_seconds: 10.0                     # Embedding request timeout in seconds.
  organization: ''                          # Optional OpenAI-compatible organization header.
  extra_headers: {}                         # Optional non-secret static headers for embedding requests.
launch: {}                            # Container and process launch settings.
tool_policy:                          # Tool-use limits, approval behavior, and policy defaults.
  restrict_to_workspace: true               # Restrict file/tool operations to the assistant workspace when supported.
  allow_web_search: true                    # Allow web search tools where configured.
  allow_shell_commands: true                # Allow shell-command tools where configured.
authorization:                        # Multi-user authorization policy enforcement.
  enabled: true                             # Enable the optional authorization provider and bounded-elevation workflow; false retains mandatory local policy and resource guards.
  engine: local_cedar_compatible            # Authorization engine: local_cedar_compatible preserves current behavior; cedar runs the official local Rust evaluator behind rollout gates.
  fail_closed: true                         # Deny protected operations when authorization cannot evaluate.
  cedar_request_timeout_seconds: 0.5        # Maximum time to wait for one local Cedar evaluator decision.
  presentation:                             # Authorization message detail shown in requests, decisions, approved access, and failures.
    mode: friendly                                # Presentation mode: friendly uses plain language; technical shows exact authorization actions, resources, scopes, limits, identifiers, and safe failure metadata.
  user_approval:                            # Authenticated deterministic gateway approval settings.
    enabled: true                                 # Expose authenticated owner approval challenges when authorization is enabled.
    challenge_ttl_seconds: 600                    # One-time gateway approval challenge lifetime in seconds.
    task_max_ttl_seconds: 3600                    # Hard lifetime ceiling for an allow-for-this-task grant or request suppression.
    task_max_uses: 100                            # Hard use-count ceiling for an allow-for-this-task grant.
  admin_elevation:                          # Admin elevation settings.
    enabled: true                                 # Enabled setting.
    challenge_ttl_seconds: 600                    # Challenge ttl seconds setting.
    allow_once_ttl_seconds: 300                   # Allow once ttl seconds setting.
    task_max_ttl_seconds: 900                     # Task max ttl seconds setting.
    task_max_uses: 10                             # Task max uses setting.
    target_profile_paths:                         # Target profile paths settings.
    - builtin://authorization/admin-elevation/default # Target profile paths setting.
  shell_command_profiles: []                # Optional deterministic exact program/argv-prefix selectors for reviewed families of similar shell commands.
  permission_delegation:                    # Operator-owned temporary delegation and persistent-policy enforcement gates.
    enabled: true                                 # Enable durable bounded grants, active policy snapshots, and shadow evaluation.
    mode: enforce                                 # Optional grant/policy evaluator mode: shadow returns baseline decisions without consuming grants; enforce applies to selected actions. Mandatory schedule and MCP boundaries remain authoritative.
    default_ttl_seconds: 900                      # Default lifetime in seconds for temporary grants and agent-requested temporary role policies.
    max_ttl_seconds: 900                          # Operator ceiling in seconds for temporary grants and agent-requested temporary role policies.
    default_max_uses: 1                           # Default maximum uses for a temporary grant.
    task_terminal_revoke: true                    # Revoke task-scoped grants when their source task becomes terminal.
    enforced_actions:                             # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - agent.definition.create                     # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - credential.binding.create                   # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - execution.run                               # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - execution.service.manage                    # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - execution.ssh.connect                       # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - execution.ssh.interact                      # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - managed_operation.execute                   # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - mcp.invoke                                  # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - runtime.restart                             # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - skill.install                               # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - skill.uninstall                             # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - tool.attach                                 # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    - tool.invoke                                 # Omitted uses the full standard approval-action set; generated configs populate it. An explicit list replaces defaults, and [] disables optional grant enforcement. These selectors grant no access and do not disable mandatory boundaries.
    enforced_capability_ids_by_action: {}         # Optional action-to-capability-id selectors that narrow grant/policy enforcement without widening an action boundary.
    enforced_targets: []                          # Optional exact action/capability/resource selectors; when present for an action, only matching grants or persistent policies may control it.
    envelopes: []                                 # Bootstrap delegation ceilings. Trusted Tool targets support task grants and permanent agent_type policies up to max_risk when the lead holds access. Empty forces human review. Persisted administration snapshots are authoritative after initialization.
  emergency_deny:                           # Dual-controlled, subtract-only emergency deny settings; private signing keys remain outside UA.
    max_duration_seconds: 3600                    # Maximum lifetime of one signed emergency deny profile.
    review_interval_seconds: 900                  # Operator review-due interval recorded in each emergency deny profile.
    proposal_ttl_seconds: 600                     # Lifetime of an inert emergency proposal awaiting an offline signature.
    approval_keys: []                             # Trusted offline Ed25519 operator public keys; an empty list makes emergency mutations unavailable.
human_interactions:                   # Durable user and administrator request inbox settings.
  workflow_max_steps: 32                    # Maximum steps in one validated visual workflow.
  workflow_diagnostic_event_limit: 1000     # Maximum redacted events per workflow diagnostic download.
  enabled: true                             # Persist, present, and reconcile human interaction requests.
  review_ttl_seconds: 604800                # Default time allowed for one human review.
  max_review_ttl_seconds: 2592000           # Hard ceiling for a human review deadline.
  maintenance_interval_seconds: 30.0        # Interval for expiry, notification, and task-wake reconciliation.
security_layer:                       # Secure tool broker and credential-store settings.
  mode: broker                              # Security mode: broker, or openshell to also sandbox agent commands.
  broker_internal_base_url: http://127.0.0.1:18600 # Agent/gateway-facing broker API URL.
  broker_public_port: 18600                 # Browser-facing broker port combined with network.public_origin.
  credential_state_backend:                 # Broker auth payload persistence settings.
    mode: credential_source                       # "files" or "credential_source".
    source: sealbox                               # Credential source when mode is credential_source, e.g. sealbox, vault, or bitwarden.
    namespace: team-cred-store                    # Credential-source namespace/path prefix.
    fallback_to_files: false                      # Fall back to broker files when credential-source read/write fails.
  credential_catalog:                       # Credential catalog settings for approved credential bindings.
    enabled: true                                 # Enable secure credential collection, signup fallback, and OpenShell binding flows.
    path: credential_bindings.yaml                # Legacy YAML migration input. Relative paths resolve under instance_root.
    database_path: credential_catalog.db          # Authoritative owner-scoped SQLite catalog. Relative paths resolve under instance_root.
    template_overrides_path: credential_template_overrides.yaml # Credential template override file. Relative paths resolve under instance_root.
    default_write_source: sealbox                 # Default store for new secrets. Unsupported write targets fail closed.
    openshell_binding_ttl_seconds: 900            # Per-use OpenShell credential binding lease lifetime.
    collection_session_ttl_seconds: 900           # Secure broker form session lifetime.
    secret_cache_ttl_seconds: 300                 # In-memory broker cache TTL for resolved catalog secrets; 0 disables.
  sealbox:                                  # Independent encrypted credential service used by the broker; relative client paths resolve under broker_credentials_dir.
    enabled: true                                 # Configure Sealbox as a broker credential source.
    manage_service: true                          # Start sealbox-server during headless launch.
    auto_initialize: true                         # Create the managed service root token when missing; user tenants are provisioned lazily.
    bind_host: 127.0.0.1                          # Managed sealbox-server listener host.
    bind_port: 8767                               # Managed sealbox-server listener port.
    store_path: dbs/sealbox.db                    # Sealbox SQLite store. Relative paths resolve under broker_credentials_dir.
    root_token_file: sealbox/root_token           # Root administration token used only for tenant lifecycle operations.
    tenant_material_dir: sealbox/tenants          # Broker-only directory containing opaque per-owner tenant tokens and key pairs.
    api_version: v2                               # Sealbox client API version. Multi-user operation requires v2.
    ready_timeout_seconds: 30                     # Seconds to wait for managed sealbox-server readiness.
  openshell:                                # OpenShell sandbox/gateway settings used when mode is openshell.
    workspace_mount: /workspace                   # Path where the workspace is mounted inside the sandbox.
    manage_gateway: true                          # Start/manage openshell-gateway in headless mode.
    gateway_bind_host: 127.0.0.1                  # OpenShell gateway listener host.
    gateway_bind_port: 18080                      # OpenShell gateway listener port.
    gateway_driver: docker                        # OpenShell backend driver.
    gateway_ready_timeout_seconds: 60             # Seconds to wait for gateway process readiness.
    gateway_extra_args: []                        # Extra openshell-gateway argv entries.
    create_if_missing: true                       # Create sandbox when missing.
    delete_on_shutdown: false                     # Delete sandbox on shutdown.
    upload_workspace: true                        # Upload workspace into the sandbox.
    no_git_ignore: false                          # Ignore .gitignore while uploading workspace.
    provision_timeout_seconds: 300                # Sandbox provisioning timeout in seconds.
    readiness_timeout_seconds: 30                 # Sandbox readiness timeout in seconds.
  code_execution:                           # Sandbox for agent-run shell and python_env commands outside OpenShell mode.
    sandbox: required                             # required confines each command to the workspace, a private temp HOME, and read-only OS files, refusing commands when the sandbox cannot apply; off runs agent code unconfined.
    extra_read_paths: []                          # Extra absolute paths sandboxed code may read. Never list the instance root.
    extra_write_paths: []                         # Extra absolute paths sandboxed code may read and write.
interactive_apps:                     # Human-facing app integrations and their listener settings.
  plugins:                                  # Registry-keyed adapter settings and the exact allowlist for optional packages.
    builtin.discord:                              # Discord settings.
      execution: in_process                             # Execution owner: in_process or the authenticated adapter_host process.
      settings:                                         # Discord app settings.
        enabled: false                                        # Enable the Discord interactive adapter.
        allowed_user_ids: []                                  # Discord user ids allowed to contact the team.
        allowed_channel_ids: []                               # Discord channel ids allowed to contact the team.
        group_policy: mention                                 # Discord group handling policy: mention or open.
        reply_to_message: true                                # Reply directly to the source Discord message when possible.
        thread_scoped_sessions: true                          # Scope Discord sessions by thread when present.
        command_guild_ids: []                                 # Optional guild-id strings for command sync.
    builtin.telegram:                             # Telegram settings.
      execution: in_process                             # Execution owner: in_process or the authenticated adapter_host process.
      settings:                                         # Telegram app settings.
        enabled: false                                        # Enable the Telegram interactive adapter.
        allowed_user_ids: []                                  # Telegram user ids allowed to contact the team.
        allowed_chat_ids: []                                  # Telegram chat ids allowed to contact the team.
        group_policy: mention                                 # Telegram group handling policy: mention or open.
        manager_offline_policy: pause_telegram_polling        # Inbound behavior when the manager is offline.
        reply_to_message: true                                # Reply directly to the source Telegram message when possible.
        topic_scoped_sessions: true                           # Scope Telegram sessions by topic when present.
        drop_pending_updates: true                            # Drop stale Telegram updates on startup.
        rich_messages: true                                   # Send Telegram replies through Bot API rich messages when supported.
        connection_pool_size: 32                              # Telegram HTTP connection pool size.
        concurrent_updates: 8                                 # Maximum Telegram updates processed concurrently.
        pool_timeout: 5.0                                     # Telegram HTTP connection-pool timeout in seconds.
    builtin.whatsapp:                             # Whatsapp settings.
      execution: in_process                             # Execution owner: in_process or the authenticated adapter_host process.
      settings:                                         # WhatsApp app settings.
        enabled: false                                        # Enable the Twilio-backed WhatsApp adapter.
        allowed_sender_ids: []                                # WhatsApp sender allowlist. Empty means no sender allowlist.
        webhook_host: 0.0.0.0                                 # Listener host for Twilio webhook callbacks.
        webhook_port: 8080                                    # Listener port for Twilio webhook callbacks.
        webhook_path: /webhooks/whatsapp                      # Twilio webhook path.
        validate_twilio_signature: true                       # Validate inbound Twilio signatures.
    builtin.signal:                               # Signal settings.
      execution: in_process                             # Execution owner: in_process or the authenticated adapter_host process.
      settings:                                         # Signal app settings for signal-cli-rest-api.
        enabled: false                                        # Enable the Signal interactive adapter.
        base_url: http://127.0.0.1:8080                       # Base URL for the authenticated signal-cli-rest-api server.
        account: ''                                           # Registered Signal account or number used by the REST server.
        allowed_sender_ids: []                                # Signal direct sender allowlist. Empty means no direct sender allowlist.
        allowed_group_ids: []                                 # Signal group id allowlist. Empty disables group handling.
        group_policy: mention                                 # Signal group handling policy: mention or open.
        mention_markers: []                                   # Case-insensitive markers required in Signal groups when group_policy is mention.
        poll_timeout_seconds: 5.0                             # Signal receive long-poll timeout in seconds.
        poll_interval_seconds: 0.25                           # Delay between empty Signal receive polls in seconds.
        max_messages_per_poll: 10                             # Maximum Signal messages requested per receive poll.
        request_timeout_seconds: 15.0                         # Signal REST request timeout in seconds.
        ignore_attachments: false                             # Ask signal-cli-rest-api not to download attachments on receive.
        ignore_stories: true                                  # Ignore Signal stories on receive.
        ignore_avatars: true                                  # Ignore Signal avatars on receive.
        ignore_stickers: true                                 # Ignore Signal stickers on receive.
        send_read_receipts: false                             # Send Signal read receipts when receiving messages.
        drop_pending_messages_on_startup: false               # Drop queued Signal receive messages when the adapter starts.
        text_mode: normal                                     # Signal outbound text mode for /v2/send.
    builtin.photon:                               # Photon settings.
      execution: in_process                             # Execution owner: in_process or the authenticated adapter_host process.
      settings:                                         # Photon Spectrum iMessage app settings.
        enabled: false                                        # Enable the Photon Spectrum iMessage adapter.
        project_id: ''                                        # Photon Spectrum project id. If empty, project_id_env_var is used.
        project_id_env_var: PHOTON_PROJECT_ID                 # Env var containing the Photon Spectrum project id.
        project_secret_env_var: PHOTON_PROJECT_SECRET         # Env var containing the Photon Spectrum project secret; keep the value in team.env or a secret file.
        sidecar_token_env_var: PHOTON_SIDECAR_TOKEN           # Optional env var containing a pre-shared Photon sidecar token.
        sidecar_bind_host: 127.0.0.1                          # Loopback bind host for the Photon sidecar.
        sidecar_port: 8789                                    # Loopback port for the Photon sidecar.
        sidecar_autostart: true                               # Start the bundled Node sidecar with the adapter.
        node_bin: node                                        # Node.js executable used to launch the Photon sidecar.
        allowed_sender_ids: []                                # Photon direct sender allowlist. Empty means no direct sender allowlist.
        allowed_group_ids: []                                 # Photon group id allowlist. Empty disables group handling.
        group_policy: mention                                 # Photon group handling policy: mention or open.
        mention_markers: []                                   # Case-insensitive markers required in Photon groups when group_policy is mention.
        request_timeout_seconds: 15.0                         # Photon sidecar HTTP request timeout in seconds.
        max_inline_attachment_bytes: 20971520                 # Maximum Photon inbound attachment bytes that the sidecar may inline.
        markdown: true                                        # Send Photon outbound text through Spectrum markdown.
        telemetry: false                                      # Enable Spectrum telemetry in the Photon sidecar.
    builtin.internal_website:                     # Internal website settings.
      execution: in_process                             # Execution owner: in_process or the authenticated adapter_host process.
      settings:                                         # Internal website and Web Chat settings.
        enabled: true                                         # Start shared docs/generated-site host with run-gateway unless --no-apps is used.
        bind_host: 0.0.0.0                                    # Listener host for the shared docs/generated-site service.
        bind_port: 18090                                      # Shared docs/generated-site listener port.
        public_port: 18090                                    # Browser-facing website port combined with network.public_origin.
        sites_dir: artifacts/single_page_sites                # Generated website content directory. Relative paths resolve under agent.workspace_dir.
        web_chat_enabled: true                                # Serve built-in Web Chat through the internal website host.
        web_chat_token_env_var: WEB_CHAT_AUTH_TOKEN           # Env var containing the Web Chat token; keep the value in team.env or a secret file.
        attachments:                                          # Built-in Web Chat attachment settings.
          enabled: true                                             # Allow uploads, pasted images, and attachment rendering in Web Chat.
          max_file_bytes: 31457280                                  # Maximum accepted Web Chat attachment size in bytes.
          cache_dir: artifacts/web_chat_attachments                 # Workspace-relative local cache for Web Chat attachment bytes.
          allowed_kinds:                                            # Attachment kinds accepted by Web Chat.
          - image                                                   # Attachment kinds accepted by Web Chat.
          - document                                                # Attachment kinds accepted by Web Chat.
          - audio                                                   # Attachment kinds accepted by Web Chat.
          - video                                                   # Attachment kinds accepted by Web Chat.
          nats_object_bucket: ua_attachments                        # NATS Object Store bucket for team-lead-coordinated remote copies.
          nats_object_ttl_seconds: 86400                            # Retention seconds for NATS Object Store attachment copies.
          remote_copy_enabled: true                                 # Allow gateway-owned on-demand mirroring to NATS Object Store.
  adapter_host:                             # Authenticated private process boundary for adapters selected with execution=adapter_host.
    enabled: false                                # Start the gateway-side adapter-host API and permit adapter_host plugin execution.
    transport: unix                               # Private transport: unix for same-host deployments or mtls for container/remote deployments.
    host_id: python-adapter-host                  # Stable authenticated identity presented by the managed Python adapter-host process.
    allowed_host_ids:                             # Exact workload identities allowed to register configured adapter instances.
    - python-adapter-host                         # Exact workload identities allowed to register configured adapter instances.
    token_env_var: ADAPTER_HOST_AUTH_TOKEN        # Env var containing the rotatable adapter-host bearer token; the token value never belongs in YAML.
    unix_socket_path: runtime/adapter-host.sock   # Permission-restricted Unix socket path. Relative paths resolve under instance_root.
    unix_socket_mode: '0600'                      # Octal permission mode applied to the Unix socket after binding.
    bind_host: 127.0.0.1                          # Listener host used only by the mTLS transport.
    bind_port: 18700                              # Listener port used only by the mTLS transport.
    connect_host: 127.0.0.1                       # Gateway DNS name or address used by the adapter-host mTLS client.
    tls:                                          # Mutual-TLS certificate and trust paths for container or remote private transport.
      server_certificate_path: ''                       # Gateway server certificate path; relative paths resolve under instance_root.
      server_private_key_path: ''                       # Gateway server private-key path; keep file permissions restrictive.
      client_ca_path: ''                                # CA bundle used by the gateway to authenticate adapter-host client certificates.
      client_certificate_path: ''                       # Adapter-host client certificate path.
      client_private_key_path: ''                       # Adapter-host client private-key path; keep file permissions restrictive.
      server_ca_path: ''                                # CA bundle used by the adapter host to authenticate the gateway server.
      server_name: ''                                   # Expected gateway TLS server name.
    limits:                                       # Gateway ceilings intersected with host-supported limits at registration.
      max_in_flight_events: 16                          # Maximum received but incomplete deliveries for one adapter stream.
      max_payload_bytes: 2097152                        # Maximum JSON payload size negotiated for one protocol message.
      max_attachment_bytes: 31457280                    # Maximum bytes accepted by one opaque attachment upload ticket.
      max_pending_events: 1000                          # Bounded durable outbox capacity per adapter stream.
      heartbeat_interval_seconds: 15.0                  # Maximum interval between adapter-host lease heartbeats.
      acknowledgement_timeout_seconds: 60.0             # Time allowed for delivery receipt/completion progress before health degrades.
      retention_seconds: 604800                         # Retention for terminal inbox/outbox records used by reconnect validation.
    lease_seconds: 45                             # Registration lease duration renewed by authenticated heartbeats.
    upload_ticket_ttl_seconds: 300                # Lifetime of a bounded one-use inbound attachment upload ticket.
    upload_dir: runtime/adapter-host-uploads      # Gateway-owned attachment transfer directory. Relative paths resolve under instance_root.
    client_state_path: dbs/adapter_host_client.db # Adapter-host local idempotency database. Relative paths resolve under instance_root.
    reconnect_initial_delay_seconds: 0.5          # Initial reconnect delay for the adapter-host client.
    reconnect_max_delay_seconds: 30.0             # Maximum bounded reconnect delay for the adapter-host client.
voice:                                # Voice input/output behavior and model defaults.
  enabled: false                            # Master voice switch.
  input_enabled: true                       # Enable inbound speech-to-text.
  output_enabled: false                     # Enable outbound text-to-speech.
  response_mode: text_only                  # Reply mode: voice_only, voice_and_text, or text_only.
  provider: grok                            # Voice provider. "grok" is implemented; "litellm_proxy" is reserved.
  api_base: https://api.x.ai/v1             # Voice API base URL.
  stt_language: en                          # Speech-to-text language hint.
  stt_format_text: true                     # Ask STT to format text.
  tts_voice: eve                            # Text-to-speech voice name.
  tts_language: auto                        # Text-to-speech language hint.
  tts_output_codec: mp3                     # Text-to-speech output codec.
  tts_sample_rate: 24000                    # Text-to-speech sample rate.
  tts_bit_rate: 128000                      # Text-to-speech bit rate.
  connect_timeout_seconds: 10.0             # Voice HTTP connect timeout in seconds.
  request_timeout_seconds: 120.0            # Voice HTTP request timeout in seconds.
activity_collector:                   # Runtime activity stream and status collection settings.
  base_url: http://127.0.0.1:8765           # Agent-side collector URL override; leave blank to derive from bind_host and bind_port.
  connect_timeout_seconds: 1.0              # HTTP connect timeout in seconds.
  request_timeout_seconds: 2.0              # HTTP request timeout in seconds.
  batch_max_events: 25                      # Maximum events sent per collector request.
  flush_interval_seconds: 1.0               # Flush interval in seconds.
  max_buffered_events: 500                  # Maximum buffered events before dropping/backpressure.
  drop_when_unavailable: true               # Drop activity events when collector is unavailable instead of blocking work.
  bind_host: 127.0.0.1                      # Collector service listener host for run-activity-collector.
  bind_port: 8765                           # Collector service listener port.
  user_url_path: /user                      # User dashboard URL path.
  admin_url_path: /admin                    # Admin dashboard URL path.
  ingest_token_env_var: ACTIVITY_COLLECTOR_INGEST_TOKEN # Env var containing the collector ingest token; keep the value in team.env or a secret file.
  storage:                                  # Activity collector persistence store.
    backend: sqlite                               # Activity collector backend: sqlite or postgres.
    sqlite:                                       # SQLite settings for activity collector events.
      path: /data/dbs/activity_collector.db             # Activity collector SQLite DB. Relative paths resolve under instance_root.
    postgres: {}                                  # Postgres settings for activity events; connection strings stay in the environment.
otel:                                 # OpenTelemetry tracing and metrics settings.
  enabled: false                            # Master OTEL switch.
  enable_traces: false                      # Export traces.
  enable_metrics: false                     # Export metrics.
  otlp_endpoint: ''                         # OTLP endpoint.
  service_name: team_nats_agents            # OTEL service name.
  headers: {}                               # Optional non-secret OTEL headers.
execution_control:                    # Immutable code, schedule, service, Kubernetes, and SSH execution settings.
  enabled: true                             # Enable the deterministic execution control plane.
  runner:                                   # Fenced batch runner and service reconciler settings.
    enabled: true                                 # Start execution controllers in headless mode.
    tick_interval_seconds: 2.0                    # Seconds between schedule materialization and run claims.
    max_concurrent_jobs: 2                        # Maximum concurrent finite run attempts.
    lease_ttl_seconds: 60                         # Lease lifetime renewed while work remains active.
    service_reconcile_interval_seconds: 10.0      # Seconds between managed-service health reconciliation.
  paths:                                    # Workspace-relative immutable artifact and ephemeral run directories.
    artifact_store_dir: runtime/execution-artifacts # Content-addressed artifact object directory.
    run_dir: runtime/execution-runs               # Ephemeral materialization directory for active runs.
  artifact_store:                           # Immutable artifact storage limits.
    maximum_artifact_bytes: 268435456             # Maximum accepted artifact size.
  profiles: []                              # Operator-authored exact build and execution profiles.
  kubernetes:                               # Kubernetes adapter settings.
    kubectl_executable: kubectl                   # Operator-installed kubectl binary path or name.
    network_policy_enforced: false                # Assert that execution namespaces enforce profile network labels.
  ssh:                                      # Interactive SSH PTY broker settings.
    enabled: false                                # Enable brokered interactive SSH sessions.
    ssh_executable: ssh                           # OpenSSH client binary path or name.
    lease_ttl_seconds: 300                        # Live PTY lease lifetime renewed on interaction.
    transcript_limit_bytes: 4194304               # Maximum captured remote-output transcript bytes.
    targets: []                                   # Operator-owned pinned SSH targets and broker-only key-file references.
web_services:                         # Agent-facing internal web research service connections; credentials remain environment or secret-file owned.
  crawl4ai:                                 # Crawl4AI 0.9.2 data-plane connection and high-risk feature policy.
    base_url: http://127.0.0.1:11235              # Internal Crawl4AI HTTP(S) URL; do not embed credentials.
    verify_tls: true                              # Verify Crawl4AI TLS certificates for HTTPS connections.
    timeout_seconds: 120.0                        # Per-request Crawl4AI HTTP timeout.
    expected_version: 0.9.2                       # Expected Crawl4AI service version reported by capability discovery.
    allow_execute_js: false                       # Permit the agent tool to call Crawl4AI's separately enabled execute_js endpoint.
    job_poll_seconds: 2.0                         # Delay between Crawl4AI background-job status polls.
    job_timeout_seconds: 300.0                    # Maximum total wait for a Crawl4AI background job.
  searxng:                                  # SearXNG metasearch service connection and result defaults.
    base_url: http://127.0.0.1:8080               # Internal SearXNG HTTP(S) URL; do not embed credentials.
    verify_tls: true                              # Verify SearXNG TLS certificates for HTTPS connections.
    timeout_seconds: 30.0                         # Per-request SearXNG HTTP timeout.
    default_num_results: 8                        # Default bounded result count returned inline to an agent.
mcp:                                  # Installed MCP connection, transport, authorization, and managed-host settings.
  enabled: true                             # Run the brokered MCP control/data plane before the first dynamic proposal exists.
  registry_dir: runtime/mcp-connections     # Secret-free installed MCP connection registry under instance_root.
  protocol_adapter: mcp_v1                  # Protocol adapter seam; use mcp_v1 until Strands supports MCP v2.
  static_reconciliation:                    # Static reconciliation settings.
    upgrade_mode: review_required                 # Existing version-4 deployments are grandfathered exactly once; new definitions require review.
  network_policy:                           # Network policy settings.
    allow_loopback: false                         # Permit approved MCP endpoints that resolve to loopback addresses.
    allow_private_networks: false                 # Permit approved MCP endpoints on private or link-local networks.
    allowed_private_hosts: []                     # Exact hostnames allowed to resolve to private addresses while other private targets remain denied.
  legacy_sse:                               # Legacy sse settings.
    enabled: true                                 # Rare compatibility transport; Streamable HTTP is the default.
    removal_target_date: '2026-11-12'             # Operator reminder for removing legacy SSE support.
  hosting:                                  # Hosting settings.
    enabled: false                                # Enable reviewed declarative MCP hosting; arbitrary agent-authored code remains forbidden.
    definitions_dir: runtime/mcp-hosting/definitions # Definitions dir setting.
    state_dir: runtime/mcp-hosting/state          # State dir setting.
    bind_host: 127.0.0.1                          # Bind host setting.
    port_range_start: 18700                       # Port range start setting.
    port_range_end: 18799                         # Port range end setting.
ui:                                   # User-interface preferences shared by onboarding and runtime web surfaces.
  onboarding:                               # Onboarding UI preferences retained for the post-reboot interface.
    appearance:                                   # Shared color theme and background preferences for web interfaces.
      color_mode: dark                                  # Default interface theme: dark or light.
      light_colors:                                     # Four background light colors for onboard-web.
      - '#082f73'                                       # Four background light colors for onboard-web.
      - '#ffd60a'                                       # Four background light colors for onboard-web.
      - '#20f05a'                                       # Four background light colors for onboard-web.
      - '#ff3030'                                       # Four background light colors for onboard-web.
      light_diffusion: 58                               # Light diffusion percentage, 0 concentrated through 100 diffuse.
      polygon_opacity_low: 20                           # Low end of moving polygon opacity percentage.
      polygon_opacity_high: 70                          # High end of moving polygon opacity percentage.
      polygon_line_color: '#202426'                     # Polygon edge color.
      polygon_line_opacity: 8                           # Polygon edge opacity percentage.
      polygon_seed: 4147                                # Stable seed for the diffuse light polygon mesh.
      dynamic_background: true                          # Animate the onboarding background.
      dark:                                             # Dark metallic mesh geometry, finish, and motion.
        surface_color: '#030202'                              # Near-black base color for every facet.
        facet_depth: 22                                       # Contrast between dark planes, from 0 through 100.
        facet_size: 220                                       # Target facet size in pixels, from 140 through 520.
        metallic_seams: 30                                    # Strength of the highlighted seam subset.
        surface_grain: 50                                     # Fine metallic surface grain strength.
        shimmer_count: 9                                      # Simultaneously moving reflections, from 0 through 10.
        shimmer_speed: 250                                    # Reflection speed percentage, from 25 through 250.
        shimmer_width: 25                                     # Reflection band width, from 4 through 40.
        mesh_morphing: false                                  # Whether polygon vertices evolve over time.
        mesh_morph_speed: 100                                 # Mesh morph speed percentage, from 25 through 250.
        seed: 9187                                            # Stable unsigned seed for facet composition.
        accents:                                              # Gold, silver, and bronze color and strength settings.
          gold:                                                     # Gold settings.
            color: '#618500'                                              # Color setting.
            strength: 89                                                  # Strength setting.
          silver:                                                   # Silver settings.
            color: '#1a1414'                                              # Color setting.
            strength: 65                                                  # Strength setting.
          bronze:                                                   # Bronze settings.
            color: '#ae6832'                                              # Color setting.
            strength: 30                                                  # Strength setting.
mcp_profiles: {}                      # MCP profile definitions available to agent tools.
