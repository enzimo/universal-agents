schema_version: 1
templates:
  approved_x_twitter_posting_login_example:
    template_id: approved_x_twitter_posting_login_example
    display_name: X/Twitter Posting Login
    description: Login credential for approved X/Twitter posting workflows.
    credential_kind: username_password
    aliases:
      - twitter posting
      - x posting
      - x login
    domains:
      - x.com
      - twitter.com
    base_template_id: x_twitter_login
    template_version: 1
    default_credential_key_template: x_twitter_posting_login
    default_purpose_template: X/Twitter login for approved posting workflows.
    flow: signup
    store_target: bitwarden
    signup_url: https://x.com/signup
    approved_by: user
    approved_at: "2026-05-28T00:00:00+00:00"
    fields:
      - name: username
        kind: username
        visibility: metadata_visible
        value_source: user_or_agent_supplied_metadata
        required: true
        label: X/Twitter username or email
        placeholder: user@example.com
        form:
          input_control: text
          autocomplete: username
      - name: service_password
        kind: password
        visibility: secret
        value_source: store_generated_secret
        generation_policy: store_native
        required: true
        label: X/Twitter password
        form:
          input_control: password
          autocomplete: new-password
    automation_steps:
      - Open https://x.com/signup.
      - Fill the approved username or email.
      - Let the broker generate the password inside the configured credential store.
      - Stop and request manual signup for CAPTCHA, bot detection, MFA, SMS or email confirmation unavailable to the agent, passkey-only registration, payment or identity verification, or repeated unexplained form failure.
